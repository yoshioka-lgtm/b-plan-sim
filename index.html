<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B型シミュレーター">
<meta name="format-detection" content="telephone=no">
<title>就労B型 収支シミュレーター</title>
<style>
:root{
  --head:#1f5f7a; --head2:#17495e; --side:#eef3f6; --line:#cfdbe2; --label:#eaf0f4;
  --text:#22313a; --sub:#5d6f7a; --blue:#1f6fb2; --green:#1d8a4e; --red:#c8372d; --orange:#e07b12;
  --bg:#f6f8fa; --card:#fff; --input:#fffbe6;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:var(--bg);font-size:15px}
header{background:var(--head);color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;height:52px;position:sticky;top:0;z-index:5;box-shadow:0 1px 3px rgba(0,0,0,.2)}
header .logo{font-weight:700;font-size:17px;letter-spacing:.05em}
header .info{display:flex;gap:8px;margin-left:auto;font-size:13px}
header .info span{background:var(--head2);padding:4px 10px;border-radius:3px}
.wrap{display:flex;min-height:calc(100vh - 52px)}
nav{width:210px;background:var(--side);border-right:1px solid var(--line);padding:12px 0;flex-shrink:0;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
nav .grp{font-size:12px;color:var(--sub);padding:12px 18px 4px}
nav a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:var(--text);text-decoration:none;border-left:4px solid transparent;cursor:pointer}
nav a:hover{background:#e1eaf0}
nav a.on{background:#fff;border-left-color:var(--head);font-weight:700;color:var(--head)}
nav svg{width:18px;height:18px;flex-shrink:0}
main{flex:1;padding:20px 24px 60px;min-width:0}
.crumb{font-size:12px;color:var(--sub);margin-bottom:4px}
h1{font-size:21px;margin:0 0 16px;padding-bottom:8px;border-bottom:3px solid var(--head)}
h2{font-size:16px;margin:0;padding:9px 14px;background:var(--label);border-bottom:1px solid var(--line);border-left:5px solid var(--head)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:18px;overflow:hidden}
.card .body{padding:14px 16px}
.note{font-size:13px;color:var(--sub);line-height:1.6}
.warn{background:#fff4e5;border:1px solid #f3c48a;color:#7a4a08;padding:10px 14px;border-radius:4px;font-size:14px;margin-bottom:14px;line-height:1.6}
/* ホーム */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}
.box{border:2px solid var(--line);border-radius:6px;padding:14px 16px;background:#fff}
.box .ttl{font-size:15px;font-weight:700;color:var(--sub)}
.box .big{font-size:34px;font-weight:800;margin:6px 0 8px;letter-spacing:.01em}
.box .big small{font-size:16px;font-weight:700;margin-left:2px}
.box ul{margin:0;padding:0;list-style:none;font-size:14px}
.box li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted #dde5ea}
.box li b{white-space:nowrap}
@media (max-width:1100px){.flow{grid-template-columns:1fr}.op{justify-content:center;font-size:22px}}
.op{display:flex;align-items:center;font-size:30px;font-weight:800;color:var(--sub)}
.box.out{border-color:#e6b3ae}.box.out .big{color:var(--red)}
.box.in{border-color:#a9c9e6}.box.in .big{color:var(--blue)}
.box.res.plus{border-color:#9fd3b4;background:#f1faf4}.box.res.plus .big{color:var(--green)}
.box.res.minus{border-color:#e6b3ae;background:#fdf3f2}.box.res.minus .big{color:var(--red)}
.ctrl{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-bottom:6px}
.ctrl label{font-weight:700}
.slider{display:flex;align-items:center;gap:12px}
.slider input{width:260px}
.slider .v{font-size:26px;font-weight:800;color:var(--head);min-width:70px}
.seg{display:inline-flex;border:1px solid var(--head);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--head);padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.seg button+button{border-left:1px solid var(--head)}
.seg button.on{background:var(--head);color:#fff;font-weight:700}
.need{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.need .num{font-size:30px;font-weight:800;color:var(--orange)}
.gauge{position:relative;height:26px;background:#eef2f5;border-radius:13px;margin:14px 0 4px;overflow:hidden}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7fb3d9,#1f6fb2);border-radius:13px}
.gauge .mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--orange)}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
table.opt{width:100%;border-collapse:collapse}
table.opt td{padding:10px 10px;border-bottom:1px solid #e3eaee;vertical-align:middle}
table.opt td:first-child{font-weight:700;width:34%}
table.opt .eff{text-align:right;font-weight:700;white-space:nowrap;width:150px}
.eff.p{color:var(--green)}.eff.z{color:var(--sub);font-weight:400}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.money div{background:#f7fafc;border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.money b{display:block;font-size:22px;margin-top:4px}
/* 汎用 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-top:4px solid var(--head);border-radius:4px;padding:10px 14px}
.kpi .t{font-size:13px;color:var(--sub)}.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.neg{color:var(--red)}.pos{color:var(--green)}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;font-size:13px;white-space:nowrap}
table.grid th,table.grid td{border:1px solid var(--line);padding:5px 8px}
table.grid th{background:var(--label);font-weight:700}
table.grid td.n{text-align:right;font-variant-numeric:tabular-nums}
table.grid tr.sec td{background:#f1f5f8;font-weight:700;color:var(--head)}
table.grid tr.b td{font-weight:700}
table.grid .stick{position:sticky;left:0;background:#fff;z-index:1;text-align:left}
table.grid th.stick{background:var(--label)}
table.grid tr.sec td.stick{background:#f1f5f8}
table.form{width:100%;border-collapse:collapse}
table.form th,table.form td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:middle}
table.form th{background:var(--label);width:30%;font-weight:700;font-size:14px}
table.form td .note{margin-top:3px}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th,table.list td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.list th{background:var(--label);font-size:13px}
table.list td.n{text-align:right}
input,select{font-family:inherit;font-size:14px;padding:5px 7px;border:1px solid #b7c6cf;border-radius:3px;background:var(--input)}
input[type=number]{width:110px;text-align:right}
input.w{width:100%}
input.s{width:72px}
table.list input.w{min-width:240px}
table.list input[type=number]{width:96px}
table.list input.s{width:64px}
select{max-width:100%}
.unit{margin-left:6px;color:var(--sub);font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--head);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);border-bottom:0;background:#e8eef2;padding:9px 16px;cursor:pointer;font-size:14px;border-radius:4px 4px 0 0;font-family:inherit;color:var(--text)}
.tabs button.on{background:var(--head);color:#fff;border-color:var(--head);font-weight:700}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;padding:7px 14px;border-radius:3px;cursor:pointer;font-size:14px;font-family:inherit}
.btn.sub{background:#fff;color:var(--blue)}
.btn.del{background:#fff;color:var(--red);border-color:#e0a8a3;padding:3px 9px;font-size:13px}
.bar{position:sticky;top:52px;z-index:4;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 14px;margin-bottom:14px;display:flex;gap:22px;flex-wrap:wrap;font-size:14px;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.bar b{font-size:16px;margin-left:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-1px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:#e8eef2;color:var(--sub)}
.tag.ok{background:#e3f4ea;color:var(--green)}.tag.ng{background:#fbe5e3;color:var(--red)}
@media (max-width:900px){
  header .logo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  header .info span:not(.keep){display:none}
  nav{width:178px}nav a{padding:12px 10px;gap:8px;font-size:14px;white-space:nowrap}nav .grp{padding:10px 12px 4px}
  .flow{grid-template-columns:1fr}.op{justify-content:center;font-size:22px}
  .kpis,.money{grid-template-columns:1fr 1fr}
  main{padding:14px}
}
@media (max-width:640px){nav{width:64px}nav a span,nav .grp{display:none}}
/* iPad・タッチ端末：入力時に画面が勝手に拡大されないよう16px以上にし、押しやすくする */
@media (pointer:coarse){input,select,textarea{font-size:16px}.btn{min-height:40px}nav a{min-height:46px}}
@supports (height:100dvh){.wrap{min-height:calc(100dvh - 52px)}nav{height:calc(100dvh - 52px)}}
.sref{margin-right:6px;color:var(--blue);text-decoration:none;font-weight:700}.gsrc li{margin-bottom:8px;word-break:break-all;border-radius:3px;transition:background .3s}
.doc{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:10px;background:#fff}.doc .dt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:16px;margin-bottom:6px}.doc .dd{font-size:14px;line-height:1.6;margin:3px 0}.doc .dl{display:inline-block;min-width:68px;font-size:12px;color:var(--sub);background:var(--label);border-radius:3px;padding:0 6px;margin-right:8px;text-align:center}
table.tasks td{vertical-align:top}
table.tasks input.w{min-width:0}
table.tasks input.tname{font-weight:700;min-width:320px}
table.tasks select{width:100%;min-width:92px}
table.tasks .btn{white-space:nowrap}
table.tasks tr.st-完了 td{background:#f3f6f8;color:#8a99a3}
table.tasks tr.st-完了 .tname{text-decoration:line-through;color:#8a99a3}
table.tasks tr.st-進行中 td:first-child{border-left:4px solid var(--blue)}
table.tasks tr.late td:first-child{border-left:4px solid var(--red)}
.shgrid{border-collapse:collapse;font-size:13px}.shgrid th,.shgrid td{border:1px solid var(--line);padding:2px;text-align:center;vertical-align:middle}.shgrid th{background:var(--label);font-weight:normal;min-width:36px;cursor:pointer;line-height:1.25;padding:4px 2px}.shgrid .off{background:#e9edf0}.shgrid th.off{background:#dfe5e9}.shgrid .sun{color:var(--red)}.shgrid .sat{color:var(--blue)}.shgrid .nm{position:sticky;left:0;z-index:1;background:#fff;text-align:left;min-width:130px;padding:4px 8px;cursor:default}.shgrid th.nm{background:var(--label)}.shgrid td.n{text-align:right;padding:4px 6px;min-width:48px}.shgrid input{width:36px;padding:5px 0;text-align:center;border:1px solid transparent;background:transparent}.shgrid input:focus{border-color:var(--blue);background:#fff}.shck{list-style:none;margin:0 0 10px;padding:0}.shck li{padding:7px 0;border-bottom:1px dashed var(--line)}
@media (pointer:coarse){.shgrid input{font-size:16px;width:40px}}
@media print{@page{size:A4 landscape}nav,header,.tools,.bar,.btn{display:none}main{padding:0}.card{break-inside:avoid}input,select{border:0;background:none}}
</style>
</head>
<body>
<header>
  <div class="logo">就労継続支援B型 収支シミュレーター</div>
  <div class="info" id="hinfo"></div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
"use strict";
// ======================================================================
// 報酬マスタ（2026年10月時点：令和6年度改定＋令和8年度改定（2026年6月施行））
// 出典は 収支計画スプシ の報酬マスタタブ・調査_*.md・検証_報酬単価.md と同じ

const MASTER = {

  ],

    ["一（4.8万円以上）",48000],["A（4.5万〜4.8万円）",45000],["二（3.8万〜4.5万円）",38000],
    ["B（3.5万〜3.8万円）",35000],["三（3.3万〜3.5万円）",33000],["C（3.0万〜3.3万円）",30000],
    ["四（2.8万〜3.0万円）",28000],["D（2.5万〜2.8万円）",25000],["五（2.3万〜2.5万円）",23000],
    ["E（2.0万〜2.3万円）",20000],["六（1.8万〜2.0万円）",18000],["F（1.5万〜1.8万円）",15000],
    ["七（1.0万〜1.5万円）",10000],["八（1万円未満）",0],
  ],
  teiin: ["20人以下","21〜40人","41〜60人","61〜80人","81人以上"],
  base: {

        [758,676,636,625,605],[738,660,620,609,590],[738,660,620,609,590],[726,641,602,591,573],
        [726,637,600,589,570],[705,624,586,575,557],[703,624,586,575,557],[682,606,569,558,541],
        [673,600,563,553,535],[590,526,494,485,468]],
    1: [[748,666,625,614,594],[726,647,607,596,577],[716,637,599,588,568],[695,618,582,571,551],
        [669,596,561,551,533],[649,580,545,535,518],[649,580,545,535,518],[637,563,529,519,503],
        [637,557,525,515,498],[618,544,511,501,485],[614,544,511,501,485],[596,528,496,486,471],
        [584,520,488,479,463],[537,478,449,440,425]],
    2: [[682,609,564,554,535],[662,591,548,538,519],[653,584,541,530,512],[634,567,525,515,497],
        [611,547,508,498,480],[594,532,493,484,467],[594,532,493,483,467],[577,517,479,469,453],
        [572,511,474,465,449],[557,497,461,452,437],[557,497,461,452,437],[541,483,448,439,424],
        [532,475,441,432,417],[490,438,405,397,384]],
    3: [[584,519,488,479,462]], 4: [[530,471,443,434,419]], 5: [[484,430,398,390,376]],
  },
  // 加算：数える対象 nobe=延べ利用日数 sogei=送迎回数 meal=加算対象食数 shoki=初期加算日数 kesseki=欠席対応回数 manual=手入力 nobeX=延べ×手入力
  kasan: [],
  gensan: [
    ["定員超過利用減算","該当する",0.70,"1日の利用者が定員の150%超、または3か月平均が定員の125%超"],
    ["人員欠如減算（職員）","3か月未満",0.70,"職業指導員・生活支援員が配置基準を下回る"],
    ["人員欠如減算（職員）","3か月以上",0.50,"同上が3か月以上続く"],
    ["人員欠如減算（サビ管）","5か月未満",0.70,"サービス管理責任者が基準を満たさない"],
    ["人員欠如減算（サビ管）","5か月以上",0.50,"同上が5か月以上続く"],
    ["個別支援計画未作成減算","3か月未満",0.70,"計画を作らないまま支援（ここでは全員に掛かる最大値で見る）"],
    ["個別支援計画未作成減算","3か月以上",0.50,"同上が3か月以上続く"],
    ["身体拘束廃止未実施減算","該当する",0.99,"記録・委員会・指針・研修のどれかが欠ける"],
    ["虐待防止措置未実施減算","該当する",0.99,"委員会・研修・担当者のどれかが欠ける"],

    ["短時間利用減算","該当する",0.70,"基本報酬Ⅳ〜Ⅵのみ。利用4時間未満の人が5割以上"],

  shogu: [["取得しない",0,""],["Ⅰイ",0.105,"最上位。福祉専門職員配置等加算の届出と、年額460万円以上の職員1人以上が必要"],
          ["Ⅰロ",0.109,"Ⅰイに生産性向上・協働化の取組を上乗せ"],["Ⅱイ",0.103,"キャリアパス要件Ⅰ〜Ⅳ＋職場環境等要件。年額460万円以上の職員1人以上が必要"],

          ["Ⅳ",0.074,"キャリアパス要件Ⅰ・Ⅱ＋職場環境等要件"]],
  tokurei: 0.984,   // 2026年6月以降の新規指定：基本報酬×984/1000（1日あたり単位で四捨五入）
  shinsetsu: 0.9,   // 開設6か月未満の人員配置は定員×90%で計算
};
(function(){
  const u = v => [v,v,v,v,v];
  const K = (name,kb,units,per,target,limit,req,excl) => MASTER.kasan.push({name,kb,units,per,target,limit,req,excl:!!excl});
  K("福祉専門職員配置等加算","Ⅰ",u(15),"日","nobe","Ⅰ〜Ⅲはいずれか1つ","直接支援の常勤職員のうち35%以上が社会福祉士・介護福祉士・精神保健福祉士・公認心理師");
  K("福祉専門職員配置等加算","Ⅱ",u(10),"日","nobe","同上","上記の資格者が常勤職員の25%以上");
  K("福祉専門職員配置等加算","Ⅲ",u(6),"日","nobe","同上","直接支援職員の常勤換算のうち常勤が75%以上、または常勤のうち勤続3年以上が30%以上");
  K("目標工賃達成指導員配置加算","取得する",[45,40,38,37,36],"日","nobe","1日1回","基本報酬Ⅰ・Ⅳ（6:1）で工賃向上計画を作り、目標工賃達成指導員を常勤換算1人以上追加配置");
  K("目標工賃達成加算","取得する",u(10),"日","nobe","","上の指導員配置加算の事業所が目標工賃を達成（前年度実績が必要）");

function merge(base, add){
  for (const k in add){
    if (add[k] && typeof add[k]==="object" && !Array.isArray(add[k]) && base[k] && typeof base[k]==="object" && !Array.isArray(base[k])) merge(base[k], add[k]);
    else base[k] = add[k];
  }
  return base;
}
function migrate(o){

    Object.assign(st[j], {name:"管理者兼生活支援員（父）", inBase:true, share:0.625, note:DEFAULTS.staff[2].note});

  return o;
}

const kasanSel = name => S.kasan[name] || {kb:"取得しない", qty:0};
function context(){
  const ch = MASTER.chiiki.find(c=>c[0]===S.chiiki) || MASTER.chiiki[5];
  const kibo = S.teiin<=20?0:S.teiin<=40?1:S.teiin<=60?2:S.teiin<=80?3:4;
  const tk = MASTER.taikei[S.taikei];
  const mo = Number(String(S.kaisetsu).split("-")[1]) || 4;
  const minashi = mo===4 ? 12 : 12 + (((3-mo)%12)+12)%12 + 1;
  const rows = MASTER.base[S.taikei];
  const ichi = tk.ev==="一律";
  const kIdx = Math.max(0, MASTER.kubun.findIndex(k=>k[0]===S.kubunAfter));
  const baseBefore = ichi ? rows[0][kibo] : rows[13][kibo];
  const baseAfter  = ichi ? rows[0][kibo] : rows[kIdx][kibo];
  const kas = KASAN_NAMES.map(name=>{
    const sel = kasanSel(name);
    const first = MASTER.kasan.find(k=>k.name===name);
    const e = MASTER.kasan.find(k=>k.name===name && k.kb===sel.kb);
    return {name, kb:sel.kb, qty:+sel.qty||0, target:first.target, unit: (sel.kb!=="取得しない" && e) ? (e.units[kibo]||0) : 0};
  });
  const exclTaken = ["視覚・聴覚言語障害者支援体制加算","高次脳機能障害者支援体制加算"].some(n=>kasanSel(n).kb!=="取得しない");
  const tokurei = (!S.tokurei || exclTaken) ? 1 : MASTER.tokurei;
  let gensan = 1;
  GEN_NAMES.forEach(n=>{ const kb = S.gensan[n]; const g = MASTER.gensan.find(x=>x[0]===n && x[1]===kb); if (g) gensan *= g[2]; });
  const shoguRate = (MASTER.shogu.find(s=>s[0]===S.shogu)||[0,0])[1];
  const staff = S.staff.map(s=>{
    let count = +s.count||0;
    if (s.auto==="kotin") count = kasanSel("目標工賃達成指導員配置加算").kb!=="取得しない" ? 1 : 0;
    if (s.auto==="meal")  count = S.mealType==="手作り" ? 1 : 0;
    const per = s.type==="常勤" ? +s.pay : s.pay*s.hours;
    const monthly = count*per*(1+(+s.bonus||0)/12);
    const fuk = monthly*S.fukuri;
    const fte = (s.type==="常勤" ? count : count*s.hours/S.jokinHours) * (s.share ?? 1);   // share：兼務の人が支援員として働く割合
    return {...s, count, per, monthly, fuk, total:monthly+fuk, fte};
  });
  const mealCost = S.mealType==="手作り" ? S.tezukuri : S.bento;
  const rent = (S.fixed.find(f=>f.name==="家賃")||S.fixed[0]||{amount:0}).amount;
  const staffTotal = staff.reduce((a,s)=>a+s.total,0);
  const initItems = S.init.items.map(it=>{
    let amount = +it.amount||0;
    if (it.auto==="deposit") amount = rent*S.init.deposit;
    if (it.auto==="prepStaff") amount = staffTotal*S.init.prep/2;
    if (it.auto==="prepRent") amount = rent*S.init.prep;
    return {...it, amount};
  });
  const initTotal = initItems.reduce((a,i)=>a+i.amount,0);
  const f = S.fund, r = f.rate/12, n = f.term-f.grace;
  const pmt = f.loan===0 ? 0 : (r===0 ? f.loan/n : f.loan*r/(1-Math.pow(1+r,-n)));
  return {tanka:ch[1], kibo, tk, minashi, ichi, baseBefore, baseAfter, kas, tokurei, gensan, shoguRate, staff, staffTotal, mealCost, rent, initItems, initTotal, pmt};
}

// 1か月分の計算。m＝開設から何か月目、reg＝登録者、prev＝前月の登録者、rate＝利用率、allStaff＝開始月を無視して全員数える
function calcMonth(c, m, reg, prev, rate, allStaff){
  const o = {m, reg};
  o.newU = Math.max(0, reg-prev);
  o.daily = Math.min(reg*rate, S.teiin);
  o.nobe = o.daily*S.days;
  const q = {
    nobe:o.nobe,
    sogei:o.nobe*S.sogeiRate*2,
    meal:S.mealType==="手作り" ? o.nobe*S.mealRate*S.lowIncome : 0,
    shoki:o.newU*S.days*rate,
    kesseki:Math.min(reg*4, (reg*S.days-o.nobe)*S.absentRate),
  };
  o.meals = o.nobe*S.mealRate;
  o.q = q;
  o.baseUnit = m<=c.minashi ? c.baseBefore : c.baseAfter;
  o.unitDay = Math.round(o.baseUnit*c.tokurei);
  o.kihon = o.unitDay*o.nobe*c.gensan;
  o.kasan = c.kas.map(k=>{
    const qty = k.target==="manual" ? k.qty : k.target==="nobeX" ? o.nobe*k.qty : q[k.target];
    return {name:k.name, kb:k.kb, units:k.unit*qty};
  });
  o.kasanSum = o.kasan.reduce((a,k)=>a+k.units,0);
  o.shogu = (o.kihon+o.kasanSum)*c.shoguRate;
  o.totalUnits = o.kihon+o.kasanSum+o.shogu;
  o.kyufu = Math.floor(o.totalUnits*c.tanka);
  o.yenKihon = o.kihon*c.tanka; o.yenKasan = o.kasanSum*c.tanka; o.yenShogu = o.kyufu-o.yenKihon-o.yenKasan;
  o.mealFee = o.meals*S.mealFee;
  o.income = o.kyufu+o.mealFee;
  o.works = S.work.map(w=>{ const sales=o.nobe*w.part*w.sales; return {name:w.name, sales, cost:sales*w.cost}; });
  o.wSales = o.works.reduce((a,w)=>a+w.sales,0);
  o.wCost = o.works.reduce((a,w)=>a+w.cost,0);
  o.wage = (o.wSales-o.wCost)*S.wageShare;
  o.wDiff = o.wSales-o.wCost-o.wage;
  o.avgWage = o.daily ? o.wage/o.daily : 0;
  const act = c.staff.filter(s=>allStaff || (+s.start||1)<=m);
  o.salary = act.reduce((a,s)=>a+s.monthly,0);
  o.fukuri = act.reduce((a,s)=>a+s.fuk,0);
  o.shoguPay = Math.floor(o.shogu*c.tanka)*S.shoguHaibun;
  o.food = o.meals*c.mealCost;
  o.fixed = S.fixed.map(f=>({name:f.name, amount:+f.amount||0}));
  o.fixedSum = o.fixed.reduce((a,f)=>a+f.amount,0);
  o.expense = o.salary+o.fukuri+o.shoguPay+o.food+o.fixedSum;
  o.profit = o.income-o.expense+o.wDiff;
  o.fte = act.filter(s=>s.inBase).reduce((a,s)=>a+s.fte,0);
  return o;
}

const regAt = (sc, m) => Math.min(sc.max, Math.round(sc.start+sc.inc*(m-1)));
function simulate(scName){
  const c = context();
  const sc = S.scen[scName||S.scenario];
  const months = [];
  for (let m=1; m<=36; m++){
    const reg = regAt(sc,m), prev = m===1 ? 0 : regAt(sc,m-1);
    months.push(calcMonth(c, m, reg, prev, sc.rate, false));
  }
  // 人員配置：6か月未満は定員×90%、6〜12か月は直近6か月、1年以上は直近12か月の1日平均
  months.forEach((o,i)=>{
    const avg = n => months.slice(i-n,i).reduce((a,x)=>a+x.daily,0)/n;
    o.baseCount = o.m<=6 ? S.teiin*MASTER.shinsetsu : o.m<=12 ? avg(6) : avg(12);
    o.needStaff = o.baseCount/c.tk.ratio;
    o.staffOK = o.fte >= o.needStaff - 1e-9;
  });
  let cum = 0; months.forEach(o=>{ cum += o.profit; o.cum = cum; });
  // 資金繰り
  const f = S.fund;
  let cash = f.self+f.loan-c.initTotal;
  const cash0 = cash;
  months.forEach(o=>{
    const inK = o.m>f.lag ? months[o.m-f.lag-1].kyufu : 0;
    const repay = o.m>f.term ? 0 : o.m<=f.grace ? f.loan*f.rate/12 : c.pmt;
    o.cashIn = inK; o.repay = repay;
    cash = cash + inK + o.mealFee + o.wSales - o.expense - o.wCost - o.wage - repay;
    o.cash = cash;
  });
  let minCash = cash0, minM = 0;
  months.forEach(o=>{ if (o.cash<minCash){ minCash=o.cash; minM=o.m; } });
  const yr = (k,y) => months.slice(12*y,12*y+12).reduce((a,o)=>a+o[k],0);
  const firstPlus = months.find(o=>o.profit>=0);
  const cumPlus = months.find(o=>o.cum>=0);
  return {c, sc, months, cash0, minCash, minM, yr, firstPlus, cumPlus};
}

// 安定期（または1年目）の1か月。新規利用者なし・職員は全員
function steady(reg, y1){
  const c = context();
  const sc = S.scen[S.scenario];
  const m = y1 ? 1 : c.minashi+1;
  const o = calcMonth(c, m, reg, reg, sc.rate, true);
  o.needStaff = o.daily/c.tk.ratio;
  return o;
}
function breakEven(y1){
  for (let n=0; n<=S.teiin*3; n++){ if (steady(n,y1).profit>=0) return n; }
  return null;
}

function applyHome(key, v){
  if (key.startsWith("k:")){ const n = key.slice(2); S.kasan[n] = {...(S.kasan[n]||{qty:0}), kb:v}; }

}

function profitChart(r){
  const M = r.months, W=960, H=260, L=60, R=10, T=16, B=34;
  const vals = M.map(o=>o.profit);
  const mx = Math.max(...vals, 0), mn = Math.min(...vals, 0);
  const span = (mx-mn)||1, y = v => T+(mx-v)/span*(H-T-B), bw = (W-L-R)/36;
  let g = "";
  for (let k=0;k<=4;k++){ const v = mn+span*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3eaee"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5d6f7a">${man(v)}万</text>`; }
  M.forEach((o,i)=>{ const x=L+i*bw+2, v=o.profit; g += `<rect x="${x}" width="${bw-4}" y="${Math.min(y(v),y(0))}" height="${Math.abs(y(v)-y(0))}" fill="${v<0?"#d9776f":"#4aa874"}"><title>${o.m}か月目 ${yen(v)}円</title></rect>`;
    if (i%3===0) g += `<text x="${x+bw/2}" y="${H-14}" font-size="11" text-anchor="middle" fill="#5d6f7a">${o.m}</text>`; });
  g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#22313a"/>`;
  return `<div class="card"><h2>月ごとの損益（緑＝黒字・赤＝赤字）</h2><div class="body"><svg class="chart" viewBox="0 0 ${W} ${H}">${g}<text x="${W-R}" y="${H-2}" font-size="11" text-anchor="end" fill="#5d6f7a">開設からの月</text></svg></div></div>`;
}
function cashChart(r){
  const M = r.months, W=960, H=260, L=64, R=10, T=16, B=34;
  const pts = [{m:0,v:r.cash0}, ...M.map(o=>({m:o.m,v:o.cash}))];
  const mx = Math.max(...pts.map(p=>p.v),0), mn = Math.min(...pts.map(p=>p.v),0);
  const span=(mx-mn)||1, y=v=>T+(mx-v)/span*(H-T-B), x=m=>L+m*(W-L-R)/36;
  let g="";
  for (let k=0;k<=4;k++){ const v=mn+span*k/4; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3eaee"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5d6f7a">${man(v)}万</text>`; }
  g += `<rect x="${L}" y="${y(0)}" width="${W-L-R}" height="${Math.max(0,y(mn)-y(0))}" fill="#fdecea"/>`;
  g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#22313a"/>`;
  g += `<polyline fill="none" stroke="#1f6fb2" stroke-width="2.5" points="${pts.map(p=>`${x(p.m)},${y(p.v)}`).join(" ")}"/>`;
  pts.forEach(p=>{ if (p.m%3===0) g+=`<text x="${x(p.m)}" y="${H-14}" font-size="11" text-anchor="middle" fill="#5d6f7a">${p.m===0?"開設前":p.m}</text>`; });
  const lo = pts.reduce((a,p)=>p.v<a.v?p:a);
  g += `<circle cx="${x(lo.m)}" cy="${y(lo.v)}" r="5" fill="#c8372d"/><text x="${x(lo.m)}" y="${y(lo.v)-12}" font-size="12" text-anchor="middle" fill="#c8372d" font-weight="700">最低 ${man(lo.v)}万円</text>`;
  return `<div class="card"><h2>手元のお金の動き（自己資金＋融資からスタート）</h2><div class="body"><svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>
  <div class="legend"><span><i style="background:#1f6fb2"></i>月末の手元資金</span><span><i style="background:#fdecea;border:1px solid #e6b3ae"></i>ここに入るとお金が足りない</span></div></div></div>`;
}

function updateDerived(){
  const c = context();
  const r = simulate();
  const st = steady(S.scen[S.scenario].max, false);
  const be = breakEven(false);
  const bar = document.getElementById("bar");
  if (bar) bar.innerHTML = `<span>安定期（登録${S.scen[S.scenario].max}人）の毎月の残り<b class="${cls(st.profit)}">${sgnMan(st.profit)}万円</b></span>
    <span>黒字になる登録者数<b>${be===null?"—":be+"人"}</b></span>
    <span>1年目の損益<b class="${cls(r.yr("profit",0))}">${sgnMan(r.yr("profit",0))}万円</b></span>
    <span>手元資金の最低額<b class="${cls(r.minCash)}">${sgnMan(r.minCash)}万円</b></span>`;
  const y1 = r.months.slice(0,12).reduce((a,o)=>a+o.avgWage,0)/12;
  const kub = MASTER.kubun.find(k=>y1>=k[1]);
  const need0 = S.teiin*MASTER.shinsetsu/c.tk.ratio;
  const fte = c.staff.filter(s=>s.inBase).reduce((a,s)=>a+s.fte,0);
  const map = {
    tanka:c.tanka.toFixed(2), kibo:MASTER.teiin[c.kibo], minashi:c.minashi, wageY1:yen(y1), wageKubun:kub?kub[0]:"",
    tokureiRate:(c.tokurei*100).toFixed(1)+"%", gensanRate:(c.gensan*100).toFixed(1)+"%", pmt:yen(c.pmt),
    staffTotal:yen(c.staffTotal), fteTotal:c.staff.reduce((a,s)=>a+s.fte,0).toFixed(2), ratio:c.tk.ratio,
    needStaff:need0.toFixed(2), staffJudge: fte>=need0-1e-9?`<span class="tag ok">OK（配置 ${fte.toFixed(2)}人分）</span>`:`<span class="tag ng">不足（配置 ${fte.toFixed(2)}人分）</span>`,
    initTotal:yen(c.initTotal), fixedSum:yen(S.fixed.reduce((a,f)=>a+(+f.amount||0),0)),
  };
  c.kas.forEach(k=>map["ku:"+k.name]=k.unit||"—");
  c.staff.forEach((s,i)=>{ map["st:"+i]=yen(s.total); map["sf:"+i]=s.fte.toFixed(2); map["sc:"+i]=s.count; });
  c.initItems.forEach((it,i)=>map["ii:"+i]=yen(it.amount));
  document.querySelectorAll("[data-d]").forEach(el=>{ const v = map[el.dataset.d]; el.innerHTML = v===undefined ? "" : v; });
  renderNav();
}

  for (let i=0;i<ks.length-1;i++){ if (o[ks[i]]===undefined) o[ks[i]] = {}; o = o[ks[i]]; }

/*GUIDE_DATA_START*/const GUIDE = [{"title": "建物・立地の基準", "summary": "B型事業所の建物は、建築基準法・消防法・大阪府のバリアフリー条例の3つに合わせる必要があります。物件を借りる前に、大阪府（建築）、泉州南広域消防本部（消防）、泉佐野市の広域福祉課の3か所へ相談するのが安全です。特に、用途変更で200㎡を超えるか、低層住宅地や市街化調整区域でないかが最初の分かれ目です。", "sections": [{"heading": "まず押さえる：申請までに建物を完成させる", "items": [{"name": "申請時には建物の手続きが終わっている必要がある", "body": "泉佐野市の手引きでは、指定（＝市から事業所として認めてもらうこと）の申請時に、改修工事とそれに付随する建築基準法などの手続き・検査、備品の設置まで完了していることが原則とされています。また、新しく始める場合はあらかじめ熊取町の障害福祉担当課に協議（＝事前に相談して調整すること）するよう書かれています。", "point": "「建物を借りて工事して、それから相談」ではなく、物件を決める前に役所へ相談するのが安全です。手引きの表紙は「令和7年8月現在」（ファイル名は202607）なので、最新版がないか窓口で確認してください。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "B型に必要な部屋・設備（設備基準）", "body": "手引きでは、訓練・作業室、相談室（話が外に漏れない工夫が必要）、洗面所、便所（利用者に合わせたもの）、多目的室などが挙げられています。相談室と多目的室は、支障がなければ兼用できます。訓練・作業室は、サービスの提供に支障がなければ設けないこともできます。設備は原則その事業所専用です。", "point": "手引きには、B型の部屋の広さを「平方メートル以上」と決める数字は見当たりません（7.43㎡などの数字は別のサービスのものです）。広さは「支障がない広さ」という書き方なので、図面を持って窓口で確認します。", "status": "確認済み", "src": ["s1"]}, {"name": "検査済証・消防の検査印の提出（障害福祉サービスで必要かは未確認）", "body": "泉佐野市の介護系サービスのページには、新築の建物では建築基準法の検査済証（＝工事が図面どおりにできたと役所が認めた証明書）を添付すること、防火対象物使用開始届に消防署の受付印と検査済印が必要なことが書かれています。", "point": "これは介護系のページで確認した内容です。障害福祉サービスでも同じ扱いかは、広域福祉課（072-493-2023）に聞いて確認が必要です。", "status": "要確認", "src": ["s19", "s2"]}]}, {"heading": "建築基準法：B型は「特殊建築物」にあたる", "items": [{"name": "B型は「児童福祉施設等」で、特殊建築物にあたる", "body": "建築基準法施行令では、就労継続支援（A型・B型）を行う施設は「児童福祉施設等」に含まれます。これは、人が多く集まるため火事などへの備えを厳しくしている「特殊建築物」の仲間です。", "point": "通所だけ（泊まらない）のB型でも、この区分に入ると国交省の通知でも整理されています。", "status": "確認済み", "src": ["s6", "s3", "s4"]}, {"name": "用途変更で確認申請が必要になるのは200㎡超", "body": "今ある建物をB型に変える（用途変更）とき、変える部分の床面積の合計が200㎡を超えると、工事の前に確認申請（＝計画が法律に合うか役所や検査機関に確認してもらう手続き）が必要です。200㎡以下なら、この手続き自体は不要です。", "point": "面積には、便所・倉庫・事務室などの共用部分やバックヤードも含まれます（大阪市の資料）。20名定員だと200㎡前後になりやすく、境目に注意です。", "status": "確認済み", "src": ["s5", "s3", "s4"]}, {"name": "200㎡以下でも、法律に合わせる義務は同じ", "body": "確認申請が不要でも、建築基準法や消防法を守る義務はなくなりません。国交省の通知は、事前に建築部局や消防に相談するよう勧めています。違反状態のまま開くと、指導を受けるおそれがあります。", "point": "「申請不要＝何もしなくてよい」ではありません。改修工事は法令どおりに行い、大規模な修繕をする場合は確認申請が必要になることもあります。", "status": "確認済み", "src": ["s3", "s4"]}, {"name": "用途変更で合わせる主な基準", "body": "大阪市の資料では、用途変更のときに合わせる主な規定として、耐火性能、防火上の間仕切壁、排煙設備、非常用照明、階段の寸法と手すり、階段やエレベーター部分の防火区画、廊下の幅などが挙げられています。条件を満たせば緩和される場合もあります。", "point": "これは大阪市の資料です。熊取町は大阪府が担当するので、府の窓口でも同じ扱いか確認します。", "status": "確認済み", "src": ["s4"]}, {"name": "2階以上に作業室を置くと、階段が2つ必要になることがある", "body": "避難階（＝地上に直接出られる階）以外の階で、B型の主な部屋（作業室など）の床面積の合計が50㎡を超えると、避難階または地上へ通じる直通階段を2つ以上設ける必要があります。主要構造部が準耐火構造などの建物では、この数字が100㎡になります。", "point": "建物の構造や小規模建物の例外もあるため、2階以上を使う場合は建築士に必ず確認してください。1階だけで計画するのが無難です。", "status": "確認済み", "src": ["s6"]}, {"name": "新築する場合は、小さくても確認申請が必要になりやすい", "body": "法律上、特殊建築物で200㎡を超える場合のほか、2階建て以上または延べ面積200㎡超の場合も確認申請が必要です。さらに都市計画区域内では、規模が小さくてもほぼ新築は確認申請の対象です（10㎡以内の増築などは除く）。", "point": "熊取町の土地が都市計画区域に入るかは、この調査では確認できていません（町の案内では新築や10㎡超の増改築で確認申請書の提出とされています）。", "status": "要確認", "src": ["s5", "s13"]}, {"name": "検査済証がない建物は「現況調査」で適合を確かめる", "body": "中古の建物で検査済証がない場合、国交省の「既存建築物の現況調査ガイドライン」に沿って、現在の状態が法律に合っているかを調べる方法があります。以前の「検査済証のない建築物のガイドライン」は2025年4月にこのガイドラインへ統合されました。", "point": "用途変更の手続きには完了検査がないため、検査済証があっても、B型に変えるときに新しく必要になる規定は別に確認が必要、とされています。調査費用や期間は建築士・検査機関に確認します。", "status": "要確認", "src": ["s17"]}, {"name": "検査済証をなくしたときの泉佐野市の扱い", "body": "泉佐野市の介護系ページでは、検査済証をなくした場合、大阪府の審査指導課に建築計画概要書などを請求し、完了検査の履歴が書かれたものを提出する扱いとされています。", "point": "障害福祉サービスでの扱いは未確認です。物件探しの段階で、検査済証の有無を貸主に必ず聞いておきましょう。", "status": "要確認", "src": ["s19"]}, {"name": "建築確認の窓口は大阪府（熊取町経由で提出）", "body": "熊取町は大阪府が建築確認と検査を行う26市町村の1つです。特定行政庁（＝建築基準法の許可や指導をする役所）は、建築主事を置かない町では都道府県知事と法律で決まっています。町の案内では、申請書はまちづくり計画課に出し、審査は大阪府の建築主事または民間の指定確認検査機関が行います。", "point": "町の標準処理期間は7日と案内されています。大阪府の窓口は審査指導課の確認・検査グループ（代表06-6941-0351、内線3026または4323、平日9時〜15時）、熊取町まちづくり計画課は072-452-6391です。", "status": "確認済み", "src": ["s5", "s11", "s12", "s13"]}]}, {"heading": "都市計画法・用途地域：その場所でB型を開けるか", "items": [{"name": "用途地域ごとの考え方は建築基準法の別表第二で決まる", "body": "用途地域（＝町をエリア分けして建てられる建物を制限する決まり）ごとに、建てられる用途が建築基準法の別表第二に書かれています。熊取町の用途地域は、町のまちづくり計画課で調べられます。", "point": "物件を見る前に、その住所の用途地域を役場で確認しておくと、無駄足が防げます。", "status": "確認済み", "src": ["s5", "s13"]}, {"name": "低層住宅の専用地域では特に要注意", "body": "第一種・第二種低層住居専用地域では、老人ホーム・保育所・福祉ホームなどは建てられます。老人福祉センター・児童厚生施設などは延べ600㎡以内ならよいとされています。B型の通所施設がどれにあたるかは、条文だけでは決まらず、特定行政庁の判断になります。", "point": "低層住居専用地域の物件は、必ず事前に大阪府の窓口に相談してください。許可が必要になる場合があります。", "status": "要確認", "src": ["s5", "s6"]}, {"name": "それ以外の住居系・商業系・準工業地域", "body": "条文を読むと、第一種中高層では老人福祉センター・児童厚生施設に似たものが建てられる一覧に入っています。第二種中高層以上の地域では、建てられない用途の一覧に福祉施設は書かれていません。ただしこれは条文を読んだ整理で、特定行政庁の公式見解ではありません。", "point": "工業専用地域は、老人ホーム・福祉ホームに似たものが禁止されており、通所のB型の扱いは不明です。工業系の物件は避けるか、事前に相談を。", "status": "要確認", "src": ["s5"]}, {"name": "市街化調整区域は原則きびしい", "body": "市街化調整区域（＝開発を抑える地域）では、開発許可を受けた区域以外で建物を新築したり、用途を変更したりするには、知事の許可が必要です（例外あり）。熊取町も、一定の要件に当てはまらないと許可されないので事前相談を、と案内しています。", "point": "調整区域の物件は、B型が許可されるかが大きなハードルです。できれば市街化区域の物件を選ぶのが安全です。", "status": "確認済み", "src": ["s7", "s14"]}, {"name": "土地を造成する場合は開発許可", "body": "市街化区域で500㎡以上の開発行為（＝建物のために土地の区画や形を変えること）は、大阪府知事の開発許可が必要です。500㎡未満でも町との協議が必要と案内されています。", "point": "既存の建物を借りる場合はふつう関係しません。更地に新築する場合の話です。", "status": "確認済み", "src": ["s14"]}]}, {"heading": "消防法：必要な消防設備", "items": [{"name": "B型は消防法で「(6)項ハ」の施設", "body": "消防法施行令の別表第一では、就労継続支援を行う施設は「(6)項ハ」に分類されます。不特定多数ではなく、自分で避難しにくい人も利用するため、比較的厳しい区分（特定防火対象物＝火災で被害が大きくなりやすい建物）です。", "point": "この区分を前提に、下の設備の基準が決まります。", "status": "確認済み", "src": ["s9"]}, {"name": "消火器は延べ150㎡以上で必要", "body": "(6)項ハの施設は、延べ面積が150㎡以上なら消火器が必要です。また、地階・無窓階（＝避難や消火に使える窓がない階）・3階以上の階で、床面積が50㎡以上の場合も必要です。", "point": "150㎡未満でも、実際には置くよう指導されることが多いと考えられますが、これは未確認です。", "status": "確認済み", "src": ["s9"]}, {"name": "自動火災報知設備は延べ300㎡以上", "body": "通所のB型（利用者を泊めない施設）は、延べ面積300㎡以上で自動火災報知設備（＝煙や熱を感知して知らせる設備）が必要です。泊める施設は面積に関係なく必要です。避難階以外に用途部分があり、階段が2つ（または屋外階段など）ない場合は、面積に関係なく必要になります。", "point": "20名定員の通所なら300㎡未満に収まることも多いですが、2階を使う場合は階段の数で条件が変わります。", "status": "確認済み", "src": ["s9"]}, {"name": "誘導灯は(6)項全体で必要", "body": "避難口を示す誘導灯と通路を示す誘導灯は、(6)項の施設すべてが対象です。ただし、避難が容易と総務省令で認められる場合は除かれます。", "point": "小規模でどこまで免除されるかは、消防の判断になります。", "status": "要確認", "src": ["s9"]}, {"name": "屋内消火栓と、消防への通報設備", "body": "屋内消火栓は延べ700㎡以上（地階・無窓階・4階以上は150㎡以上）で必要で、耐火構造などでは面積が2〜3倍に緩和されます。消防機関へ通報する火災報知設備は、延べ500㎡以上で必要です。", "point": "20名規模の小さな事業所では該当しにくい基準ですが、建物の大きさ次第です。", "status": "確認済み", "src": ["s9"]}, {"name": "防火管理者は収容人員30人以上で必要", "body": "(6)項ハの施設は、収容人員（＝そこにいる人の数）が30人以上なら防火管理者（＝防火の責任者）を選び、消防計画を作って消防へ届ける必要があります。収容人員は、職員の数と利用者などの数を足して数えます。20名定員に職員を足すと30人前後になるため、境目になります。", "point": "実際の数え方（定員で数えるか等）は消防署に確認します。30人未満でも、収容人員20人以上50人未満には非常警報器具、50人以上には非常ベルなどの設置基準があります。", "status": "要確認", "src": ["s8", "s9", "s10"]}, {"name": "その他の義務：防炎、工事の届出、点検", "body": "(6)項の施設ではカーテンなどに防炎性能（＝燃え広がりにくい性質）のある物品を使う必要があります。消防設備の工事では、甲種消防設備士が着工の10日前までに届出をします。設置後は定期的に点検して結果を消防へ報告する必要があります（延べ1,000㎡以上は有資格者による点検）。", "point": "業者に頼めば手続きは代行してもらえますが、費用と期間は事前に見積もりを取ります。", "status": "確認済み", "src": ["s8", "s9"]}, {"name": "相談先は泉州南広域消防本部（熊取消防署）", "body": "熊取町を受け持つ消防は、泉州南消防組合の泉州南広域消防本部で、熊取消防署があります。消防設備などの事前相談は予防課が窓口です。国交省の通知も、事前相談を勧めています。", "point": "泉佐野市の古い資料（2013年）には予防課の電話が072-469-0119とありますが、広報くまとりには別の番号らしき記載もあり、最新の番号は要確認です。", "status": "要確認", "src": ["s18", "s20", "s21", "s3"]}, {"name": "消防署の検査と使用開始届は、指定申請より前に", "body": "泉佐野市の介護系ページでは、指定申請の前に消防署の設備検査を終えること、防火対象物使用開始届に消防署の受付印と検査済印が必要なことが書かれています。", "point": "障害福祉サービスでも同じ流れかは確認が必要です。工事のスケジュールは、消防検査の時間も見込んで組みます。", "status": "要確認", "src": ["s19", "s2"]}]}, {"heading": "大阪府福祉のまちづくり条例：バリアフリーの基準", "items": [{"name": "条例の対象になる可能性が高い", "body": "大阪府の条例では、老人福祉センター・児童厚生施設・身体障害者福祉センターに類するものが、規模を問わない（すべて）対象です。通所の老人デイサービスセンターがこの分類に入っており、B型も同じ扱いになる可能性があります。", "point": "B型が具体的にどの分類かは、国の逐条解説（法令の解説書）の該当ページを確認できていません。府の窓口に聞いてください。", "status": "要確認", "src": ["s15", "s16"]}, {"name": "対象なら小さな建物でも基準を守る義務", "body": "国の法律では2,000㎡以上が対象ですが、大阪府は条例で規模を引き下げ、すべてを対象にしています。新築・増築・改築・用途変更の部分が対象です。200㎡未満には、簡易な基準とチェックリスト（令和8年4月版）が用意されています。", "point": "出入口、廊下、便所、通路など、段差をなくすなどの基準があります。工事前に設計者に伝えておくと、あとからやり直さずに済みます。", "status": "要確認", "src": ["s16"]}, {"name": "条例は令和8年4月1日に改正施行済み", "body": "条例は令和7年10月24日に改正され、令和8年4月1日に施行されました。逐条解説も令和8年4月に改訂されています。", "point": "古い情報（令和7年以前）を元に設計していないか、設計者に確認します。", "status": "確認済み", "src": ["s15", "s16"]}]}], "sources": [{"id": "s1", "title": "障害福祉サービス事業者等指定申請の手引き（日中活動系等）", "publisher": "泉佐野市 広域福祉課（泉佐野市・泉南市・阪南市・熊取町・田尻町・岬町）", "url": "https://www.city.izumisano.lg.jp/material/files/group/12/tebiki_nittyuu_202607.pdf", "date": "表紙は令和7年8月現在（ファイル名は202607）"}, {"id": "s2", "title": "指定障害福祉サービス事業者の新規申請等について", "publisher": "泉佐野市", "url": "https://www.city.izumisano.lg.jp/kakuka/kenkou/kouiki/menu/shougai/16174.html", "date": "2025年10月1日更新"}, {"id": "s3", "title": "小規模建築物を対象とした医療・福祉施設、宿泊施設、集客施設等を所管する関係部局との連携について（国住指第661号）", "publisher": "国土交通省 住宅局建築指導課", "url": "https://www.mlit.go.jp/common/001294996.pdf", "date": "令和元年6月24日"}, {"id": "s4", "title": "既存建築物を福祉関係施設に用途変更する場合の確認申請について", "publisher": "大阪市 都市計画局建築指導部", "url": "https://www.city.osaka.lg.jp/toshikeikaku/cmsfiles/contents/0000208/208354/010625hukusisisetu.pdf", "date": "令和元年6月"}, {"id": "s5", "title": "建築基準法（第2条、第6条、第87条、別表第一、別表第二）", "publisher": "e-Gov法令検索", "url": "https://laws.e-gov.go.jp/law/325AC0000000201", "date": "2026年10月30日取得"}, {"id": "s6", "title": "建築基準法施行令（第19条、第115条の3、第121条、第130条の4、第137条の18）", "publisher": "e-Gov法令検索", "url": "https://laws.e-gov.go.jp/law/325CO0000000338", "date": "2026年10月30日取得"}, {"id": "s7", "title": "都市計画法（第29条、第43条）", "publisher": "e-Gov法令検索", "url": "https://laws.e-gov.go.jp/law/343AC0000000100", "date": "2026年10月30日取得"}, {"id": "s8", "title": "消防法（第8条、第17条の3の3、第17条の14）", "publisher": "e-Gov法令検索", "url": "https://laws.e-gov.go.jp/law/323AC1000000186", "date": "2026年10月30日取得"}, {"id": "s9", "title": "消防法施行令（別表第一、第1条の2、第4条の3、第10・11・21・23・24・26・36条）", "publisher": "e-Gov法令検索", "url": "https://laws.e-gov.go.jp/law/336CO0000000037", "date": "2026年10月30日取得"}, {"id": "s10", "title": "消防法施行規則（第1条の3 収容人員の算定方法）", "publisher": "e-Gov法令検索", "url": "https://laws.e-gov.go.jp/law/336M50000008006", "date": "2026年10月30日取得"}, {"id": "s11", "title": "建築確認申請 窓口案内", "publisher": "大阪府 建築指導室審査指導課", "url": "https://www.pref.osaka.lg.jp/o130180/kenshi_shinsa/kenshi_shinsa/index.html", "date": "2026年1月9日更新"}, {"id": "s12", "title": "大阪府が業務を行なう市町村一覧", "publisher": "大阪府", "url": "https://www.pref.osaka.lg.jp/o130180/kenshi_kikaku/kikaku_sidou/gyoumu_shityouson.html", "date": "2009年8月3日更新（古いため窓口案内と併せて確認）"}, {"id": "s13", "title": "建築物を建てる場合の制限と届出", "publisher": "熊取町 まちづくり計画課", "url": "https://www.town.kumatori.lg.jp/soshiki/machidukuri/gyomu/sumai_hikkoshi/kenchiku/1434.html", "date": "更新日の記載なし"}, {"id": "s14", "title": "開発許可制度", "publisher": "熊取町 まちづくり計画課", "url": "https://www.town.kumatori.lg.jp/soshiki/machidukuri/sinseidownload/shinsei_jigyousya/machidukuri/1426.html", "date": "更新日の記載なし"}, {"id": "s15", "title": "大阪府福祉のまちづくり条例", "publisher": "大阪府（例規集）", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000861.html", "date": "令和7年10月24日改正、令和8年4月1日施行"}, {"id": "s16", "title": "大阪府福祉のまちづくり条例 逐条解説（特別特定建築物・基準適合義務の規模）", "publisher": "大阪府内建築行政連絡協議会", "url": "https://www.pref.osaka.lg.jp/o130170/kenshi_kikaku/fukushi_top/chikujo-kaisetsuh27.html", "date": "2026年6月4日更新（令和8年4月改訂）"}, {"id": "s17", "title": "既存建築物の活用の促進について（既存建築物の現況調査ガイドライン）", "publisher": "国土交通省", "url": "https://www.mlit.go.jp/jutakukentiku/jutakukentiku_house_fr_000061.html", "date": "ガイドライン第5版（旧ガイドラインは2025年4月1日に統合）"}, {"id": "s18", "title": "泉佐野市の協議先関係課について", "publisher": "泉佐野市 都市計画課", "url": "https://www.city.izumisano.lg.jp/kakuka/toshi/toshi/menu/shido/shido_kyogi.html", "date": "2013年4月1日更新（古い）"}, {"id": "s19", "title": "通所型サービスA（防火対象物使用開始届・検査済証の記載）", "publisher": "泉佐野市", "url": "https://www.city.izumisano.lg.jp/kakuka/kenkou/kouiki/menu/sougou/siteisinsei/15388.html", "date": "検索結果の要約で確認（本文は未精読）"}, {"id": "s20", "title": "泉佐野市地域防災計画 資料3 消防関係（泉州南消防組合組織図）", "publisher": "泉佐野市", "url": "https://www.city.izumisano.lg.jp/material/files/group/70/siryouhensyouboukannkei.pdf", "date": "令和4年5月現在の資料"}, {"id": "s21", "title": "広報くまとり No.888", "publisher": "熊取町", "url": "https://www.town.kumatori.lg.jp/material/files/group/1/kouhoukumatoriR75pdf.pdf", "date": "令和7年"}]}, {"title": "人員・設備・運営の基準", "summary": "B型を開くには、職員（管理者・サビ管・職業指導員・生活支援員）、部屋、日々の運営の3つの基準を満たす必要があります。ご家族だけでは職員数が足りない可能性が高く、職業指導員を含めた追加採用の想定が必要です。虐待防止・身体拘束・BCP・情報公表は、未実施だと報酬が1〜5%減るため、開設時から準備が必要です。", "sections": [{"heading": "全体像と指定までの流れ", "items": [{"name": "3つの基準とは", "body": "事業所を開くには「人員基準（＝働く職員の種類と人数のルール）」「設備基準（＝建物・部屋のルール）」「運営基準（＝日々の運営のやり方のルール）」の3つを満たす必要があります。国の省令（平成18年厚生労働省令第171号）が土台で、泉佐野市の手引きは大阪府の条例（平成24年大阪府条例第107号）を指定基準として案内しています。", "point": "条例の条文そのものは今回未取得です。国の省令と中身が同じかは市で最終確認してください。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "指定の申請スケジュール", "body": "指定（＝市から事業所として認めてもらうこと）は毎月1日付けが基本です。申請書は希望する指定日の前月10日まで、事前協議（＝申請前の相談）が必要なものは3か月前の末日までに出します。B型は事前協議が必要（要予約）です。", "point": "2027年春の開設なら、事前協議の締切日を早めに市へ確認してください。正確な日付は市の受付スケジュールで要確認です。", "status": "要確認", "src": ["s1", "s9"]}, {"name": "申請時点で人と建物が完成している必要", "body": "申請時には、人員と設備が事業開始時点の状態で確定しているのが原則です。改修工事なら、工事と建築基準法などの手続き・検査、備品の設置まで終わっている必要があります。", "point": "「工事が終わってから申請」という順番になるので、開設時期から逆算して計画します。", "status": "確認済み", "src": ["s1"]}, {"name": "指定後に出す書類", "body": "指定を受けたら、管理者・サービス管理責任者・基準上必要な職員の雇用契約書（労働条件通知書）の写しと、開始後1か月以内に社会保険・労働保険の加入が分かる書類の写しを提出します。出さないと早めに運営指導（＝市の立ち入り確認）が入ることがあります。", "point": "家族で働く場合も、雇用契約書と社会保険の加入が確認される扱いです。家族の場合の取り扱いは市に要確認です。", "status": "確認済み", "src": ["s1"]}]}, {"heading": "人員基準（働く人のルール）", "items": [{"name": "必要な職種はこの4つ", "body": "B型に必要なのは、管理者1人、サービス管理責任者（＝個別支援計画を作り支援全体を見る責任者。略してサビ管）1人以上、職業指導員（＝作業を教える人）1人以上、生活支援員（＝生活面を支える人）1人以上です。", "point": "職業指導員と生活支援員は、それぞれ最低1人ずつ必要です（片方だけでは不可）。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "管理者の要件", "body": "管理者になれるのは次のいずれかの人です。(1)社会福祉主事の資格要件に当てはまる人、(2)社会福祉事業に2年以上従事した人、(3)社会福祉施設長認定講習会を修了した人、(4)企業を経営した経験がある人。", "point": "お母様がどれに当てはまるかは、職歴や資格の確認が必要です（手引き23ページの表で確認）。", "status": "確認済み", "src": ["s1"]}, {"name": "管理者の兼務", "body": "管理者は原則その事業所の専任ですが、利用者の支援に支障がなければ、同じ事業所の他の職務や他の事業所の職務と兼務できます。", "point": "お母様が管理者とサビ管を兼ねる形は、手引き上は認められます（次のサビ管の項を参照）。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "サビ管の人数", "body": "サビ管は利用者60人以下で1人以上です。そのうち1人以上は常勤（＝その事業所で決められた常勤の勤務時間に達している人）でなければなりません。", "point": "定員20人なら1人で足ります。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "サビ管になる条件（実務経験）", "body": "サビ管には「実務経験」と「研修修了」の両方が必要です。実務経験は、相談支援の仕事なら5年以上、直接支援（介護など）なら8年以上、福祉系の任用資格などがある人の直接支援なら5年以上、国家資格で業務に3年以上、などです。1年とは「期間1年以上かつ勤務180日以上」で、5年なら900日以上が必要です。", "point": "お母様の職歴がどの区分に入るか、日数まで数えて確認する必要があります。区分の細かい適用は手引きの表（40〜41ページ）で確認してください。", "status": "要確認", "src": ["s1"]}, {"name": "サビ管の研修", "body": "研修は「基礎研修（26時間）」と「相談支援従事者初任者研修（講義部分）」を受け、実務経験（OJT＝現場で経験を積むこと）を2年以上積んでから「実践研修（14.5時間）」を修了すると、サビ管として配置できます。その後5年ごとに更新研修が必要です。", "point": "すでに3〜8年の実務経験がある人が、個別支援計画づくりの業務に就いて指定権者へ届け出た場合に限り、OJTが6か月以上になる例外があります。研修の開催時期・申込は大阪府の研修案内で要確認です。", "status": "確認済み", "src": ["s6", "s7", "s1"]}, {"name": "サビ管のみなし配置", "body": "サビ管が急に欠けたとき、基礎研修などを修了している人が実践研修を終えるまで最長2年、サビ管として配置できる扱いが大阪府のページで案内されています。研修が未修了でも、実務経験（3〜8年）がある人を欠けた日から1年間みなす従来の扱いもあります。いずれも退職・病休など、事業所の責任でない理由で欠けた場合に限られます。", "point": "これは欠員が出たときの救済策で、新規開設時に使えるとは手引きに書かれていません。開設時から研修修了者が必要と考えて準備し、市に確認してください。", "status": "要確認", "src": ["s6", "s7"]}, {"name": "サビ管の兼務", "body": "サビ管は専任が原則ですが、利用者の支援に支障がなければ、管理者、または基準の人数を超えて配置している職員との兼務ができます。", "point": "基準の人数に数えている職業指導員や生活支援員とは兼務できない、という読み方になります。", "status": "確認済み", "src": ["s1"]}, {"name": "職業指導員・生活支援員の人数", "body": "2つの職種の合計が、常勤換算（＝職員の勤務時間を常勤1人分に直した人数）で「利用者数÷10」以上必要です。そのうち、職業指導員か生活支援員のどちらか1人以上は常勤で専従（＝その事業所の仕事だけをする人）でなければなりません。", "point": "お父様が常勤の生活支援員になる計画は、「常勤1人以上」の条件を満たせます。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "「7.5対1」は今も残っているか", "body": "残っています。ただし人員の最低基準は10対1で、報酬の区分として「6対1（Ⅰ）」「7.5対1（Ⅱ）」「10対1（Ⅲ）」から選びます。職員を手厚く置くほど基本報酬が高くなります。定員20人以下で平均工賃月額4.8万円以上（令和8年6月からの新しい基準）の場合、6対1は837単位、7.5対1は748単位、10対1は682単位／日です。", "point": "どの区分で届け出るかは、人件費と収入の兼ね合いで決めます。報酬の詳細は別担当の資料で確認してください。", "status": "確認済み", "src": ["s10", "s5", "s3"]}, {"name": "目標工賃達成指導員", "body": "目標工賃達成指導員は、基準上は必ず置く職種ではなく、令和6年度から「配置加算」（上乗せ報酬）の対象です。定員20人以下で1日45単位。常勤換算で1人以上置き、職業指導員と生活支援員の合計が6対1以上、指導員を含めた合計が5対1以上という手厚い配置が必要です。", "point": "新規開設の最初から目指す必要はありません。余裕ができてから検討する加算です。", "status": "確認済み", "src": ["s4", "s5"]}, {"name": "常勤換算の計算方法", "body": "常勤換算は「職員全員の1週間の勤務時間の合計÷常勤の人が1週間に働く時間」です。常勤の週の時間が32時間を下回るときは32時間で計算します。必要人数を出すときは小数点第2位を切り上げ、実際の人数を出すときは小数点第2位を切り捨てます。", "point": "手引きの例：利用者20人÷6=3.4人必要、勤務合計141時間÷40時間=3.5人で基準を満たす。", "status": "確認済み", "src": ["s1"]}, {"name": "新規開設時の利用者数の推定", "body": "人員の計算に使う利用者数は、新規指定のときは推定数を使います。実績が6か月未満（実績なしを含む）なら「定員の90%」です。定員20人なら18人となり、必要な職業指導員と生活支援員の合計は18÷10=1.8人（常勤換算）です。", "point": "開設後は実績に応じて、6か月以上1年未満は直近6か月の延べ利用者数÷開所日数で計算します。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "ご家族だけで足りるか（試算）", "body": "最低1.8人（常勤換算）の職業指導員・生活支援員が必要で、お父様が常勤で1.0人。残りの0.8人以上と、職業指導員を1人以上置く必要があります。お母様の管理者とサビ管の時間は、この人数には数えられない読み方です。", "point": "お母様が管理者・サビ管に加えて職業指導員も兼ねられるかは手引きに明記がなく、市に要確認です。職員を1名以上追加する前提で資金計画を立てるのが安全です。上の人数は当方の試算です。", "status": "要確認", "src": ["s1", "s2"]}]}, {"heading": "設備基準（部屋と建物のルール）", "items": [{"name": "必要な設備は5種類", "body": "必要なのは、訓練・作業室、相談室、洗面所、便所、多目的室その他運営上必要な設備です。作業に必要な機械や備品も備えます。", "point": "作業の内容（軽作業、手工芸、パソコンなど）で必要な備品が変わります。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "兼用してよい部屋", "body": "相談室と多目的室は、利用者の支援に支障がなければ兼用できます。訓練・作業室は、サービス提供に支障がない場合は設けないこともできます。設備は原則その事業所専用ですが、支障がなければ他と共用も可能です。", "point": "「支障がない」かどうかの判断は市が行うため、図面で事前協議の際に確認します。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "部屋の面積の目安", "body": "国の省令や手引きには「支障のない広さ」とあるだけで、具体的な平方メートルの数字はありません。大阪府や泉佐野市が数字の目安を持っているかは、確認できませんでした。", "point": "利用定員20人で何平方メートル必要か、市に図面を持って事前協議で確認が必要です。", "status": "要確認", "src": ["s1", "s2"]}, {"name": "相談室のつくり", "body": "相談室は、室内の話が外にもれないように、間仕切りなどを設けます。", "point": "パーテーションで足りるか、壁が必要かは市に要確認です。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "洗面所と便所", "body": "どちらも「利用者の特性に応じたもの」と定められています。具体的な数や広さ、バリアフリーの程度は数字で定められていません。", "point": "車いすの利用者を受け入れるかどうかで必要な造りが変わります。市と大阪府のバリアフリー関係の条例も要確認です。", "status": "要確認", "src": ["s1", "s2"]}, {"name": "建築・消防の手続き", "body": "建物を事業所に使う場合の建築基準法（用途変更など）や消防法（消防設備、防火管理者など）の手続きは、別に必要になる場合があります。手引きは、改修工事と建築基準法などの手続き・検査が申請前に済んでいることを求めています。", "point": "どの手続きが必要かは建物の広さや種類で変わります。今回は一次情報を取得できておらず、消防署と市の建築指導部門に要確認です。", "status": "要確認", "src": ["s1"]}]}, {"heading": "運営基準（日々のやり方のルール）", "items": [{"name": "利用定員", "body": "利用定員は20人以上が必要です。複数のサービスをまとめて行う多機能型なら、B型部分は10人以上で、全体で20人以上です。定員を超えて受け入れることは原則できません。超えた場合は報酬が減ります。", "point": "定員20人で届け出る計画は、最低ラインちょうどです。", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "個別支援計画", "body": "サビ管が、利用者ごとに面談で状況を把握（アセスメント）し、会議を開いて原案を作り、本人や家族に説明して文書で同意をもらい、交付します。その後も定期的に実施状況を確認し、見直します。計画が作られていないと報酬が減ります。", "point": "算定構造の表では、未作成が続くと報酬が7割、さらに続くと5割になる区分があります。細かい条件は別担当の報酬資料で確認してください。", "status": "確認済み", "src": ["s1", "s5", "s2"]}, {"name": "工賃の支払い（月3,000円以上）", "body": "生産活動の収入から必要経費を引いた額を、工賃（＝利用者に払う作業の対価）として支払います。利用者全員の1か月あたりの平均工賃は3,000円を下回ってはいけません。工賃は国のお金（自立支援給付）から払ってはいけない決まりもあります。", "point": "工賃の水準を高める努力義務もあります。", "status": "確認済み", "src": ["s2"]}, {"name": "年度ごとの工賃目標", "body": "毎年度、工賃の目標水準を決め、その目標と前年度の平均工賃を利用者に知らせ、大阪府に報告します。", "point": "法令に書かれているのは「目標水準の設定・通知・報告」です。「工賃向上計画」という名前の書式の作成義務の有無は、大阪府の工賃向上計画のページで要確認です。", "status": "要確認", "src": ["s2", "s8"]}, {"name": "平均工賃月額の計算（報酬用）", "body": "報酬の区分に使う平均工賃月額は、令和6年度から「年間の工賃支払総額÷（年間の延べ利用者数÷年間の開所日数）÷12か月」で計算します。障害基礎年金1級の人が半数以上なら、2,000円を加えた額を使います。", "point": "開所したばかりで前年度の実績がない事業所は、指定から1年間（年度途中の指定なら初年度と2年度目）は1万円未満の区分とみなされ、支援開始から6か月たつと、その6か月の平均工賃で区分を見直す届出ができます（大阪府の案内。詳しくは報酬の資料）。", "status": "要確認", "src": ["s3", "s4", "s11"]}, {"name": "虐待防止（未実施は1%減算）", "body": "次の3つが義務です。(1)虐待防止の委員会を定期的に開き結果を職員に周知、(2)職員への虐待防止研修を定期的に実施、(3)それらを進める担当者を置く。運営規程にも虐待防止の措置を書きます。未実施だと所定の報酬の1%が減ります。", "point": "委員会はテレビ電話でも開けます。少人数でも委員会を開いた記録が必要です。", "status": "確認済み", "src": ["s2", "s3"]}, {"name": "身体拘束等の適正化（未実施は1%減算）", "body": "利用者を縛るなど行動を制限することは、命や身体を守る緊急やむを得ない場合を除き禁止です。やむを得ず行ったときは、方法・時間・利用者の状態・理由を記録します。委員会の定期開催、適正化の指針づくり、研修の実施も義務で、できていないと通所系では所定の報酬の1%が減ります。", "point": "B型でも、身体拘束がなくても委員会・指針・研修の実施が求められる点に注意が必要です。", "status": "確認済み", "src": ["s2", "s3"]}, {"name": "業務継続計画（BCP）（未策定は1%減算）", "body": "BCP（＝感染症や災害のときも事業を続け、早く再開するための計画）を作り、計画に沿った対応をします。職員への周知、研修・訓練の定期実施、定期的な見直しも必要です。感染症と災害のどちらかでも未策定なら1%減算で、猶予期間は令和7年3月31日で終わっています。", "point": "現在は猶予がなく、開設時点から策定が必要です。", "status": "確認済み", "src": ["s2", "s3"]}, {"name": "感染症対策（衛生管理）", "body": "感染症や食中毒の予防とまん延防止のため、委員会の定期開催、指針の整備、職員への研修と訓練の定期実施が義務です。設備や飲み水を衛生的に管理することも求められます。", "point": "この項目単独の減算は確認できませんでしたが、BCP（感染症分）は未策定で減算になります。", "status": "確認済み", "src": ["s2"]}, {"name": "非常災害対策", "body": "消火設備などの設備、非常災害の具体的計画、関係機関への通報・連絡体制を整え、職員に周知します。避難や救出の訓練を定期的に行い、訓練に地域住民が参加できるよう連携に努めます。", "point": "計画の中身（火災・地震・水害など）は消防署の指導を受けながら作成します。", "status": "確認済み", "src": ["s2", "s1"]}, {"name": "苦情解決", "body": "苦情を受け付ける窓口を設けて記録します。市が行う調査には協力し、指導や助言を受けたら改善します。", "point": "窓口の連絡先は、利用者に渡す重要事項説明書や事業所内の掲示に書きます。", "status": "確認済み", "src": ["s2"]}, {"name": "地域連携推進会議（B型は対象外）", "body": "地域の人や家族、市の担当者を集めて年1回以上開く「地域連携推進会議」は、共同生活援助（グループホーム）に義務づけられたもので、B型の条文には含まれていません。", "point": "B型は、地域住民や関係機関との連携に努める一般的な努力義務が中心です。", "status": "確認済み", "src": ["s2", "s3"]}, {"name": "情報公表（未報告は5%減算）", "body": "障害福祉サービス等情報公表システムへの報告が義務で、未報告だと就労継続支援は所定の報酬の5%が減ります。指定の更新（6年ごと）のときにも、報告済みかが確認されます。", "point": "指定後に事業所情報を登録し、毎年の更新作業が必要です。", "status": "確認済み", "src": ["s3", "s1"]}, {"name": "契約・説明・掲示・協力医療機関", "body": "契約の前に重要事項説明書を渡して説明し、同意を得ます。運営規程（目的、職員、営業日、定員、費用、緊急時対応、非常災害対策、虐待防止など）を定め、事業所内に掲示します。あらかじめ協力医療機関を決めておきます。", "point": "契約は原則書面で行い、契約したときは市への報告も必要です。", "status": "確認済み", "src": ["s2", "s1"]}, {"name": "記録と秘密保持", "body": "計画、サービス提供の記録、身体拘束の記録、苦情、事故の記録などは、提供した日から5年間保存します。利用者や家族の秘密を漏らしてはならず、職員が辞めた後も守る措置が必要です。", "point": "個人情報の保管場所と持ち出しルールを早めに決めておくと安心です。", "status": "確認済み", "src": ["s2"]}, {"name": "生産活動・実習・就職支援", "body": "作業は、地域の実情や需要を考えて計画し、利用者の負担が過重にならないようにします。防塵や消火の設備など、安全に作業するための措置も必要です。実習先の確保、ハローワークでの求職の支援、就職後の定着支援は努力義務です。", "point": "作業内容（何を作る・何をするか）は、工賃収入と直結する最重要の検討事項です。", "status": "確認済み", "src": ["s2"]}, {"name": "減算（報酬が減る）の主なもの", "body": "運営に関係する主な減算は次のとおりです。虐待防止措置未実施1%、身体拘束廃止未実施1%、BCP未策定1%、情報公表未報告5%、利用者数が定員を超えた場合、職員やサビ管の人数不足、個別支援計画の未作成、短時間利用減算（4時間未満の利用者が5割以上で70%に）。", "point": "人数不足や計画未作成は、続くほど減算が重くなります。細かい割合は別担当の報酬資料で確認してください。", "status": "確認済み", "src": ["s3", "s5", "s4"]}, {"name": "就労選択支援（令和7年10月から）", "body": "令和7年10月から、B型を使いたい人は、原則として利用申請の前に「就労選択支援」（＝本人に合う働き方を一緒に整理する新サービス）を使います。", "point": "対象外の人や経過措置の範囲は今回確認できませんでした。利用者募集の流れに影響するため、市に要確認です。", "status": "要確認", "src": ["s3"]}]}], "sources": [{"id": "s1", "title": "障害福祉サービス事業者等 指定申請の手引き（日中活動系）", "publisher": "泉佐野市・泉南市・阪南市・熊取町・田尻町・岬町 広域福祉課", "url": "https://www.city.izumisano.lg.jp/material/files/group/12/tebiki_nittyuu_202607.pdf", "date": "表紙は令和7年8月現在。PDFの作成日は2026年7月22日（42ページ）"}, {"id": "s2", "title": "障害者の日常生活及び社会生活を総合的に支援するための法律に基づく指定障害福祉サービスの事業等の人員、設備及び運営に関する基準（平成18年厚生労働省令第171号）", "publisher": "厚生労働省（e-Gov法令検索）", "url": "https://laws.e-gov.go.jp/law/418M60000100171", "date": "2026-10-30取得。附則の最新は令和7年3月31日の改正。以降の改正は要確認"}, {"id": "s3", "title": "令和6年度障害福祉サービス等報酬改定における主な改定内容", "publisher": "厚生労働省 報酬改定検討チーム", "url": "https://www.mhlw.go.jp/content/001216034.pdf", "date": "令和6年2月6日"}, {"id": "s4", "title": "令和6年度障害福祉サービス等報酬改定の概要", "publisher": "厚生労働省", "url": "https://www.mhlw.go.jp/content/001216035.pdf", "date": "令和6年版"}, {"id": "s5", "title": "障害福祉サービス等報酬算定構造（令和6年度）", "publisher": "厚生労働省", "url": "https://www.mhlw.go.jp/content/12200000/001205331.pdf", "date": "令和6年度版（以降の更新は要確認）"}, {"id": "s6", "title": "サービス管理責任者等の要件に関する改正について", "publisher": "大阪府", "url": "https://www.pref.osaka.lg.jp/o090080/jigyoshido/jiritu_top/sabikannadokaisei.html", "date": "2023年7月4日更新"}, {"id": "s7", "title": "サービス管理責任者等研修制度の変更点のポイント（別添）", "publisher": "厚生労働省資料（大阪府掲載）", "url": "https://www.pref.osaka.lg.jp/documents/5112/betten.pdf", "date": "令和5年（大阪府ページ掲載）"}, {"id": "s8", "title": "令和6年度 障がい福祉サービス事業者向け情報（就労継続支援B型・減算関係）", "publisher": "大阪府", "url": "https://www.pref.osaka.lg.jp/o090080/jigyoshido/jiritu_top/r6sya-guidance.html", "date": "令和6年度"}, {"id": "s9", "title": "指定障害福祉サービス事業者の新規申請等について", "publisher": "泉佐野市 広域福祉課", "url": "https://www.city.izumisano.lg.jp/kakuka/kenkou/kouiki/menu/shougai/16174.html", "date": "2025年10月1日更新"}, {"id": "s10", "title": "障害福祉サービス費等の報酬算定構造（令和8年度見直し箇所反映版）", "publisher": "厚生労働省", "url": "https://www.mhlw.go.jp/content/12200000/001658031.pdf", "date": "令和8年度版"}, {"id": "s11", "title": "就労継続支援B型の基本報酬の届出（新規指定の場合の扱い）※大阪府所管の市町向けページ", "publisher": "大阪府 福祉部 障がい福祉室", "url": "https://www.pref.osaka.lg.jp/o090080/jigyoshido/jiritu_top/kihon_hoshu.html", "date": "令和8年度版"}]}, {"title": "報酬・加算・減算", "summary": "B型の報酬は『1日の単価×通所日数』で決まります。2026年6月以降に新しく認められる事業所は、基本報酬が約1.6%引き下げられ（令和9年度の報酬改定までの暫定措置）、指定から1年間（5月〜3月の年度途中に指定された場合は初年度と2年度目）は最低の工賃区分（1万円未満）で計算されますが、開始6か月後に区分を上げる届出ができます。加算は『届出が前月15日まで』などの期限があり、実績が必要なものは1年目は使えません。", "sections": [{"heading": "1. いちばん大事な結論：新規開設の報酬の扱い", "items": [{"name": "新規事業所だけ基本報酬が少し下がる（応急的な報酬単価）", "body": "2026年6月1日以降に新しく指定（＝市から事業所として正式に認められること）されたB型事業所は、基本報酬（＝サービスの土台になる1日あたりの報酬）が通常の984/1000（＝約1.6%減）になります。2027年春に指定を受ける事業所は、指定日の条件には当てはまります。", "point": "所定単位数の1000分の984。国の資料では『令和9年度報酬改定までの間』の措置とされているため、2027年4月以降の開設時点でこの減額が続くか・別の形になるかは、令和9年度改定の内容で要確認", "status": "確認済み", "src": ["s2", "s13"]}, {"name": "対象になる日付の基準", "body": "対象は「令和8年6月1日以降に新規指定された事業所」で、既存の事業所は従前どおりです。国は、審査を急がせて6月前に指定するような運用は望ましくなく、通常の事前相談・審査の日程で処理するよう求めています。", "point": "指定日が基準。開設日ではなく『指定日』", "status": "確認済み", "src": ["s2"]}, {"name": "減額しなくてよい特例（配慮措置）", "body": "医療連携体制加算（Ⅳ）の対象利用者分、視覚・聴覚言語障害者支援体制加算や高次脳機能障害者支援体制加算を算定する事業所、離島・中山間地域（特別地域加算の対象地域）の事業所、自治体が公募や補助で設置を必要とした事業所は、従前の単価のままです。", "point": "熊取町で一般的に開設する場合は該当しない見込みですが、特別地域加算の対象地域か、市の公募・補助に当たるかは泉佐野市への確認が必要です", "status": "要確認", "src": ["s2"]}, {"name": "新規開設の初年度は『最低の工賃区分』で計算", "body": "新規指定の事業所は実績（前年度の工賃）がないため、平均工賃月額が1万円未満の区分（区分八）とみなして基本報酬を計算します。期間は、4月に指定されたなら初年度の1年間、5月〜3月の年度途中に指定されたなら初年度と2年度目の1年間です（大阪府の案内）。国の資料でも新規指定直後は『経過措置期間（区分八）』と図示されています。", "point": "区分八＝人員配置6:1・定員20人以下で590単位（応急的単価を掛けた後は約580.6単位）。指定月が4月か5月以降かで、区分八の期間が大きく変わる点に注意", "status": "確認済み", "src": ["s3", "s1", "s8"]}, {"name": "開始6か月後に区分を上げられる", "body": "支援を開始して6か月が経過した月から、その年度の3月まで、開始後6か月間の平均工賃月額に応じた区分で算定する届出ができます（国の資料に『支援を開始してから6ヶ月間の平均工賃に基づく区分』の図があります）。工賃を上げれば初年度のうちに報酬も上がる仕組みです。", "point": "届出が必要（大阪府は専用様式『新規指定後6月間の平均工賃月額に応じて算定する場合』を用意）。泉佐野市での様式・手続きは要確認", "status": "確認済み", "src": ["s3", "s8", "s15"]}, {"name": "1人1日あたりの報酬のおおよその目安（試算）", "body": "区分八・定員20人以下で、6:1配置なら約6,003円、7.5:1なら約5,464円、10:1なら約4,986円です（単位数×0.984×10.34円で計算）。実際の入金は、これに通所日数・加算などが加わります。", "point": "試算であり公式の金額ではありません。端数処理（小数点以下の扱い）と地域単価10.34円（6級地）は指定権者の最新資料で要確認", "status": "要確認", "src": ["s1", "s2"]}]}, {"heading": "2. 基本報酬のしくみ（定員20人以下）", "items": [{"name": "報酬は『1日の単価（単位）×通所日数×地域の単価』", "body": "報酬は『単位』（＝報酬の点数）で決まり、1単位の円換算は地域で違います。熊取町は6級地で1単位10.34円（ご依頼時の前提）です。事業所は国保連（＝国民健康保険団体連合会、報酬を支払う窓口）に請求します。", "point": "10.34円は前提値。泉佐野市（指定権者）の資料で最終確認を", "status": "要確認", "src": ["s1"]}, {"name": "2つの報酬体系から選ぶ", "body": "B型の基本報酬には、『平均工賃月額（利用者に払った工賃の平均）で決まる体系（Ⅰ・Ⅱ・Ⅲ）』と、『利用者の就労や生産活動などへの参加等で一律に評価する体系（Ⅳ・Ⅴ・Ⅵ）』があります。どちらかを選び、年度の途中では変更できないとされています。", "point": "変更ルールは民間解説による記載。泉佐野市に確認を", "status": "要確認", "src": ["s6", "s15"]}, {"name": "人員配置で（Ⅰ）（Ⅱ）（Ⅲ）が決まる", "body": "（Ⅰ）は職員が利用者6人に1人（6:1）、（Ⅱ）は7.5人に1人、（Ⅲ）は10人に1人の配置です。手厚い配置ほど単価が高く、同じ工賃区分なら（Ⅰ）が最も高くなります。（Ⅳ）（Ⅴ）（Ⅵ）も同じく6:1、7.5:1、10:1です。", "point": "職員数の数え方（常勤換算＝勤務時間を常勤職員に換算した人数）は指定申請の手引き等で要確認", "status": "要確認", "src": ["s1", "s6"]}, {"name": "（Ⅰ）6:1配置の単位数（工賃方式・令和8年6月〜）", "body": "定員20人以下の1日あたり：4.8万円以上837、4.5万〜4.8万未満812、3.8万〜4.5万未満805、3.5万〜3.8万未満781、3.3万〜3.5万未満758、3万〜3.3万未満738、2.8万〜3万未満738、2.5万〜2.8万未満726、2.3万〜2.5万未満726、2万〜2.3万未満705、1.8万〜2万未満703、1.5万〜1.8万未満682、1万〜1.5万未満673、1万円未満590。", "point": "新規事業所は下の『×0.984』がかかります", "status": "確認済み", "src": ["s1"]}, {"name": "（Ⅱ）7.5:1配置の単位数", "body": "定員20人以下：4.8万円以上748、4.5万〜4.8万未満726、3.8万〜4.5万未満716、3.5万〜3.8万未満695、3.3万〜3.5万未満669、3万〜3.3万未満649、2.8万〜3万未満649、2.5万〜2.8万未満637、2.3万〜2.5万未満637、2万〜2.3万未満618、1.8万〜2万未満614、1.5万〜1.8万未満596、1万〜1.5万未満584、1万円未満537。", "point": "", "status": "確認済み", "src": ["s1"]}, {"name": "（Ⅲ）10:1配置の単位数", "body": "定員20人以下：4.8万円以上682、4.5万〜4.8万未満662、3.8万〜4.5万未満653、3.5万〜3.8万未満634、3.3万〜3.5万未満611、3万〜3.3万未満594、2.8万〜3万未満594、2.5万〜2.8万未満577、2.3万〜2.5万未満572、2万〜2.3万未満557、1.8万〜2万未満557、1.5万〜1.8万未満541、1万〜1.5万未満532、1万円未満490。", "point": "", "status": "確認済み", "src": ["s1"]}, {"name": "（Ⅳ）（Ⅴ）（Ⅵ）参加等評価方式の単位数", "body": "定員20人以下：（Ⅳ）6:1は584単位、（Ⅴ）7.5:1は530単位、（Ⅵ）10:1は484単位（1日につき）。工賃の金額によらず一律です。新規の初年度は、工賃方式の最低区分（6:1で590）とほぼ同水準です。", "point": "（Ⅳ）〜（Ⅵ）では地域協働加算・ピアサポート実施加算が使え、短時間利用減算の対象になります", "status": "確認済み", "src": ["s1", "s6"]}, {"name": "令和8年6月からの『基本報酬区分の基準の見直し』", "body": "平均工賃月額の計算方法が令和6年度に変わって工賃が約6千円高く出るようになったため、区分の金額基準を3千円ずつ引き上げました。区分が下がり過ぎないよう、減額が約3%以内になる中間区分（Ａ〜Ｆ）も新設されました。区分七（1万〜1.5万円）と八（1万円未満）の間は据え置きです。", "point": "令和6年4月以降に指定された事業所はこの見直しの対象（＝新しい基準で判定）。熊取町の事業所はこの新基準で判定されます", "status": "確認済み", "src": ["s2", "s3", "s4"]}, {"name": "新規事業所は『見直しの対象』", "body": "令和6年度改定の前後で区分が上がっていない古い事業所は見直しの対象外ですが、令和6年4月以降に指定を受けた事業所は見直しの対象です。泉佐野市のページにも同じ趣旨が書かれています。", "point": "つまり新規事業所は、新しい（3千円高い）基準で区分が決まる", "status": "確認済み", "src": ["s3", "s4", "s5"]}, {"name": "平均工賃月額の計算式", "body": "新しい式は『1年間に払った工賃の総額 ÷（1年間の延べ利用者数 ÷ 1年間の開所日数）÷ 12か月』です。障害基礎年金1級の方が半数以上いる場合は、算出額に2千円を加えて区分を判定します。", "point": "開所日数と延べ利用者数の記録が大切です。工賃は生産活動の収益から支払うのが原則", "status": "確認済み", "src": ["s2", "s6"]}, {"name": "工賃を『払える収益』が前提", "body": "工賃は生産活動の収入から経費を引いた分を全額払うのが原則で、収益のないまま工賃を払う（持ち出し）運営は不適切とされています。報酬から工賃を出す形にはできません。", "point": "自治体の運営指導では決算書・工賃台帳などが確認される（久留米市資料。熊取町は泉佐野市に確認）", "status": "確認済み", "src": ["s13"]}]}, {"heading": "3. 加算（基本報酬に上乗せされる報酬）", "items": [{"name": "福祉・介護職員等処遇改善加算（Ⅰ〜Ⅳ）", "body": "職員の賃金アップに使うための加算で、基本報酬＋他の加算の合計に率を掛けます。B型の率は、Ⅰイ10.5%、Ⅰロ10.9%、Ⅱイ10.3%、Ⅱロ10.7%、Ⅲ8.8%、Ⅳ7.4%（令和8年6月〜。国の単位数表で確認）。", "point": "最大約1割上乗せ。賃金改善計画・キャリアパス要件などを満たして事前に届出が必要。新規で取りやすいのは最初は下位区分（Ⅲ・Ⅳ）の見込み（要確認）", "status": "確認済み", "src": ["s2", "s1", "s11"]}, {"name": "福祉専門職員配置等加算（Ⅰ）（Ⅱ）（Ⅲ）", "body": "社会福祉士・介護福祉士・精神保健福祉士・公認心理師などの資格者や、常勤・長く勤める職員が一定割合いると加算されます。Ⅰ15、Ⅱ10、Ⅲ6単位（1日）。", "point": "目安：Ⅰは有資格者35%以上、Ⅱは25%以上（民間解説）。職員採用次第で新規でも狙える。割合は要確認", "status": "要確認", "src": ["s1", "s14"]}, {"name": "目標工賃達成指導員配置加算", "body": "工賃を上げる専任の指導員（目標工賃達成指導員）を常勤換算で1人以上置き、職業指導員と生活支援員の合計が6:1以上、指導員を含めた合計が5:1以上という手厚い配置で工賃向上に取り組むと加算されます。定員20人以下で1日45単位。", "point": "人件費が先に必要。工賃方式（Ⅰ〜Ⅲ）向けの加算", "status": "確認済み", "src": ["s1", "s16"]}, {"name": "目標工賃達成加算", "body": "上の加算を算定している事業所が、工賃向上計画の目標を達成すると1日10単位が加算されます。国のQ&Aに、目標が『前年度実績＋全国平均の伸び以上』で、実績が目標以上、という判定方法があります。", "point": "前年度の実績が必要なので、開所1年目は難しい", "status": "確認済み", "src": ["s1", "s7"]}, {"name": "食事提供体制加算", "body": "低所得などの利用者に食事を出す事業所への加算で、1日30単位。現在は栄養面の確認（管理栄養士等による献立確認、摂食量の記録、約6か月ごとの体重・BMI記録）を条件に、経過措置（＝特別に認められる猶予期間）が令和9年3月31日までとされています。", "point": "2027年春の開所時点では期限の直前。4月以降も続くかは令和9年度改定の結果次第で要確認", "status": "要確認", "src": ["s1", "s6", "s14"]}, {"name": "送迎加算（Ⅰ）（Ⅱ）", "body": "自宅などと事業所の間の送迎を行うと、片道につき（Ⅰ）21単位、（Ⅱ）10単位。同一敷地内の送迎は70%。", "point": "回数・平均利用人数の要件があります（細部は要確認）。車両・運転手の費用との兼ね合い", "status": "要確認", "src": ["s1"]}, {"name": "初期加算", "body": "利用を開始してから30日間、1日30単位。", "point": "新規利用者が増える開所期に取りやすい。算定の細かい条件は要確認", "status": "確認済み", "src": ["s1"]}, {"name": "欠席時対応加算", "body": "急な病気などで欠席した利用者に連絡し、相談に乗って記録すると、1回94単位（月4回まで）。", "point": "記録を残すだけで取りやすい", "status": "確認済み", "src": ["s1"]}, {"name": "利用者負担上限額管理加算", "body": "利用者の負担上限額（月の自己負担の上限）を事業所が管理する場合、月1回150単位。複数の事業所を使う利用者が対象です。", "point": "対象者がいる場合のみ", "status": "確認済み", "src": ["s1"]}, {"name": "医療連携体制加算（Ⅰ〜Ⅵ）", "body": "看護職員が事業所を訪問して健康観察や医療的ケアを行うと加算。Ⅰ32、Ⅱ63、Ⅲ125、Ⅳは利用者数で800/500/400、Ⅴ500、Ⅵ100単位（1日）。", "point": "看護職員の確保が必要。Ⅳは新規の減額の配慮対象", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "訪問支援特別加算", "body": "連続して利用がない利用者の自宅を訪問して相談に乗ると、1時間未満187単位、1時間以上280単位（月2回まで）。", "point": "連続5日の利用なしなどの条件は要確認", "status": "要確認", "src": ["s1", "s14"]}, {"name": "重度者支援体制加算（Ⅰ）（Ⅱ）", "body": "前年度の利用者に障害基礎年金1級の方が多いと加算。定員20人以下でⅠ56単位（半数以上）、Ⅱ28単位（25%以上）。Ⅰを算定すると平均工賃月額に2千円を加算して区分判定します。", "point": "前年度の利用者構成が基準なので、新規の初年度は取れない（取れても2年目以降）", "status": "確認済み", "src": ["s1", "s8", "s14"]}, {"name": "就労移行支援体制加算", "body": "前年度に一般就労（＝会社などで働くこと）に移り、6か月以上続いた人がいると、1日の単位数×その人数で加算。令和8年度から年間の人数は定員までが上限に。", "point": "前年度の実績が必要。新規の初年度は取れない", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "就労移行連携加算", "body": "利用終了時に就労移行支援事業所などへつなぐ連携をすると1回1,000単位。", "point": "利用者の移行次第", "status": "確認済み", "src": ["s1"]}, {"name": "地域協働加算（Ⅳ〜Ⅵ体系のみ）", "body": "地域住民・企業・自治体と協力して、生産活動の収入につながる取組を行い、公表すると1日30単位。", "point": "工賃方式（Ⅰ〜Ⅲ）では算定不可。協力先の確保が必要", "status": "確認済み", "src": ["s1", "s6", "s14"]}, {"name": "ピアサポート実施加算（Ⅳ〜Ⅵ体系のみ）", "body": "障害や病気を経験した人（ピアサポーター）が相談・助言を行うと月100単位。", "point": "ピアサポーター配置の届出が必要（大阪府様式）", "status": "確認済み", "src": ["s1", "s8", "s14"]}, {"name": "在宅時生活支援サービス加算", "body": "自宅での支援が効果的と市町村が認めた利用者に居宅で支援すると1日300単位。", "point": "市の判断次第。新規でも対象者がいれば可能", "status": "要確認", "src": ["s1", "s14"]}, {"name": "社会生活支援特別加算", "body": "医療観察法の対象者など、特別な支援が必要な人を受け入れ、計画に基づく相談援助を行うと1日480単位。", "point": "施設基準の届出が必要。一般的な開設では想定しにくい", "status": "要確認", "src": ["s1", "s14"]}, {"name": "視覚・聴覚言語障害者支援体制加算（Ⅰ）（Ⅱ）", "body": "利用者の50%以上（Ⅰ）／30%以上（Ⅱ）が視覚・聴覚・言語に重い障害があり、意思疎通の専門職員を配置していると1日51／41単位。", "point": "対象利用者次第。新規減額の配慮対象", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "高次脳機能障害者支援体制加算", "body": "高次脳機能障害の方が一定割合以上いて、専門の研修を受けた職員を置くと1日41単位。", "point": "対象利用者次第。新規減額の配慮対象", "status": "確認済み", "src": ["s1", "s2"]}, {"name": "その他の加算（緊急時受入・集中的支援・体験利用支援）", "body": "緊急時受入加算1日100単位、集中的支援加算1回1,000単位（月4回まで）、障害福祉サービスの体験利用支援加算（Ⅰ）500／（Ⅱ）250単位（1日）。", "point": "特別な体制や対象者が前提で、通常の新規開設では優先度は低い", "status": "確認済み", "src": ["s1"]}]}, {"heading": "4. 減算（報酬が減らされるルール）", "items": [{"name": "利用者数が定員を超えた場合（定員超過利用減算）", "body": "利用者が定員を超えると、所定単位数の70%になります。", "point": "定員20名なので、体験利用や欠席の見込みで多く受け入れすぎないこと。判定の詳しい基準（3か月平均など）は要確認", "status": "確認済み", "src": ["s1", "s14"]}, {"name": "職員が足りない場合（人員欠如減算）", "body": "職業指導員・生活支援員が基準に満たないと70%（欠如が3か月以上続くと50%）。", "point": "開所時の採用計画が重要。『1割を超える欠如は翌月から、1割以内は翌々月から』などの細則は要確認", "status": "確認済み", "src": ["s1", "s14"]}, {"name": "サービス管理責任者がいない場合", "body": "サービス管理責任者（＝個別支援計画をつくる責任者）が基準に満たないと70%（5か月以上続くと50%）。", "point": "指定の要件でもあるので欠員は致命的", "status": "確認済み", "src": ["s1"]}, {"name": "個別支援計画を作っていない場合", "body": "個別支援計画（＝利用者ごとの支援の計画書）が作られていないと70%（3か月以上続くと50%）。", "point": "開所後すぐ作る体制が必要", "status": "確認済み", "src": ["s1"]}, {"name": "虐待防止措置をしていない場合", "body": "虐待防止委員会の開催・指針の整備・研修・担当者の設置などをしないと、所定単位数の1%減（99/100）。", "point": "運営規程や指針を開所前に整える", "status": "確認済み", "src": ["s1", "s14"]}, {"name": "身体拘束の廃止措置をしていない場合", "body": "身体拘束の適正化（記録・委員会・指針・研修） /* ===== 勤務表。泉佐野市「勤務形態一覧表（就労継続支援A型・B型）」の項目に合わせた入力表。氏名などはこの端末の中だけに保存 ===== */
const SHKEY = "b-plan-shift-v1";
const SH_JOBS = ["管理者","サービス管理責任者","職業指導員","生活支援員","目標工賃達成指導員","その他"];
const SH_FORMS = [["A","A 常勤・専従"],["B","B 常勤・兼務"],["C","C 非常勤・専従"],["D","D 非常勤・兼務"]];
const SH_DIRECT = ["職業指導員","生活支援員"];
// 2026-10-31 決定の体制：父＝管理者兼生活支援員、母＝サービス管理責任者兼職業指導員
const SH_ROWS0 = [["管理者","B","父：生活支援員と兼務"],["生活支援員","B","父：管理者と兼務"],["サービス管理責任者","B","母：職業指導員と兼務"],["職業指導員","B","母：サービス管理責任者と兼務"],["職業指導員","A","雇用（常勤・専従）"],["生活支援員","C","パート"]];
function shDefault(){
  return {y:2027, m:4, period:"4週", kind:"予定", gaisyu:"無", week:40, month:160, users:+(S.teiin*0.9).toFixed(1), svc:6, off:{},
    rows:SH_ROWS0.map(([job,form,kenmu])=>({job, form, qual:"", name:"", kenmu, h:{}}))};
}
function loadSH(){ try { const t = localStorage.getItem(SHKEY); if (t) return Object.assign(shDefault(), JSON.parse(t)); } catch(e) {} return shDefault(); }
function saveSH(){ try { localStorage.setItem(SHKEY, JSON.stringify(SH)); } catch(e) {} }
let SH = loadSH();
const shMK = () => `${SH.y}-${SH.m}`;
const shDays = () => SH.period==="4週" ? 28 : new Date(SH.y, SH.m, 0).getDate();
const shWd = d => new Date(SH.y, SH.m-1, d).getDay();
function shOff(d){ const o = (SH.off[shMK()]||{})[d]; return o===undefined ? (shWd(d)===0 || shWd(d)===6) : o; }
const shJoukin = r => r.form==="A" || r.form==="B";
// 「休」は常勤の休暇。市の記入方法では、常勤の休暇は勤務したものとして数える（1日＝週の所定時間÷5）
function shHour(r, d){ const mk = shMK(), v = ((r.h||{})[mk]||{})[d];
  if (v==="休"){ if (!shJoukin(r)) return 0; const nm = r.name.trim();
    const same = nm ? SH.rows.filter(x=>x.name.trim()===nm && ((x.h||{})[mk]||{})[d]==="休").length : 1; return SH.week/5/(same||1); }
  return +v || 0; }
const fl1 = x => Math.floor(x*10+1e-9)/10, ce1 = x => Math.ceil(x*10-1e-9)/10;

function shCalc(){
  const n = shDays(), wk = Math.max(+SH.week||0, 32);
  const cap = SH.period==="4週" ? wk*4 : (+SH.month||wk*n/7);
  const rows = SH.rows.map(r=>{
    let sum = 0; for (let d=1; d<=n; d++) sum += shHour(r, d);
    const total = Math.min(sum, cap);
    const weekAvg = SH.period==="4週" ? total/4 : total/(n/7);
    const fte = SH.period==="4週" ? total/4/wk : total/cap;
    return {r, sum, total, weekAvg, fte, on: total>0 || !!r.name.trim()};
  });
  const fteOf = jobs => rows.filter(x=>jobs.includes(x.r.job)).reduce((a,x)=>a+x.fte, 0);
  const cnt = (job, f) => rows.filter(x=>x.r.job===job && x.on && (!f || f(x.r))).length;
  const users = +SH.users || 0, c = context();
  const direct = fl1(fteOf(SH_DIRECT)), kotin = fl1(fteOf(["目標工賃達成指導員"]));
  const need10 = ce1(users/10), needSel = ce1(users/c.tk.ratio);
  const noStaffDays = [];
  for (let d=1; d<=n; d++) if (!shOff(d) && !rows.some(x=>SH_DIRECT.includes(x.r.job) && shHour(x.r, d)>0)) noStaffDays.push(d);
  const ck = [
    ["管理者が1人いる", cnt("管理者")>=1, "管理者は常勤。管理業務に支障がなければ、サービス管理責任者などとの兼務も可"],
    ["サービス管理責任者が1人以上（うち1人は常勤）", cnt("サービス管理責任者")>=(users<=60?1:1+Math.ceil((users-60)/40)) && cnt("サービス管理責任者", shJoukin)>=1, "利用者60人以下なら1人以上。勤務形態をA・Bにすると常勤"],
    ["職業指導員が1人以上", cnt("職業指導員")>=1, ""],
    ["生活支援員が1人以上", cnt("生活支援員")>=1, ""],
    ["職業指導員か生活支援員のうち1人以上が常勤・専従", rows.some(x=>SH_DIRECT.includes(x.r.job) && x.on && x.r.form==="A"), "勤務形態をAにした人が1人以上必要"],
    [`職業指導員＋生活支援員が常勤換算 ${need10.toFixed(1)}人以上（基準：利用者${users}人÷10）`, direct>=need10, `今の配置 ${direct.toFixed(1)}人`],
  ];
  if (c.tk.ratio < 10) ck.push([`報酬区分「${c.tk.name.split("（")[0]}」の配置：常勤換算 ${needSel.toFixed(1)}人以上（利用者${users}人÷${c.tk.ratio}）`, direct>=needSel, `今の配置 ${direct.toFixed(1)}人。足りないと基本報酬の区分を下げる必要があります`]);
  if (cnt("目標工賃達成指導員")) ck.push(["目標工賃達成指導員配置加算：指導員が常勤換算1人以上・職業指導員＋生活支援員が6:1以上・指導員を含め5:1以上",
    kotin>=1 && direct>=ce1(users/6) && fl1(direct+kotin)>=ce1(users/5), `指導員 ${kotin.toFixed(1)}人／2職種 ${direct.toFixed(1)}人（必要 ${ce1(users/6).toFixed(1)}）／合計 ${fl1(direct+kotin).toFixed(1)}人（必要 ${ce1(users/5).toFixed(1)}）`]);
  // 兼務：同じ氏名の行をまとめ、1日の時間を職種ごとに按分しているか（合計が1日の所定時間以内）、常勤・兼務なら合計が所定時間に届くか
  const dayMax = (+SH.week||0)/5, people = {};
  rows.forEach(x=>{ const nm = x.r.name.trim(); if (nm) (people[nm] = people[nm]||[]).push(x); });
  const kenmu = Object.entries(people).filter(([,xs])=>xs.length>=2);
  if (kenmu.length){
    const over = [];
    kenmu.forEach(([nm,xs])=>{ for (let d=1; d<=n; d++){ const h = xs.reduce((a,x)=>a+shHour(x.r,d),0); if (h>dayMax+1e-9) over.push(`${nm} ${d}日（${fmtH(h)}時間）`); } });
    ck.push([`兼務の人：1日の時間を職種ごとに分け、合計が1日 ${fmtH(dayMax)}時間以内（例：管理者3時間＋生活支援員5時間）`, !over.length, over.length ? `超えている日：${over.slice(0,8).join("・")}${over.length>8?" ほか":""}` : ""]);
    const short = kenmu.filter(([,xs])=>xs.some(x=>x.r.form==="B")).map(([nm,xs])=>[nm, xs.reduce((a,x)=>a+x.total,0)]).filter(([,t])=>t<cap-1e-9);
    const many = kenmu.filter(([,xs])=>new Set(xs.map(x=>x.r.job)).size>=3).map(([nm])=>nm);
    ck.push(["兼務は2職種まで", !many.length, many.length ? `3職種以上：${many.join("・")}（出典未確認。実務経験による運用ルール）` : "出典未確認。実務経験による運用ルール"]);
    // 市の手引き：サビ管が兼務できるのは「管理者」か「人員配置基準を超える人数を配置しているサービス提供職員」だけ
    const sabi = kenmu.filter(([,xs])=>xs.some(x=>x.r.job==="サービス管理責任者") && xs.some(x=>SH_DIRECT.includes(x.r.job))).map(([nm])=>nm);
    if (sabi.length){
      const rest = rows.filter(x=>!sabi.includes(x.r.name.trim()));
      const restD = fl1(rest.filter(x=>SH_DIRECT.includes(x.r.job)).reduce((a,x)=>a+x.fte,0));
      const has = job => rest.some(x=>x.r.job===job && x.on);
      ck.push([`サービス管理責任者が職業指導員・生活支援員を兼ねる場合：その人を除いても基準（常勤換算 ${need10.toFixed(1)}人・職業指導員1人・生活支援員1人）を満たす`,
        restD>=need10 && has("職業指導員") && has("生活支援員"),
        `除いた配置 ${restD.toFixed(1)}人／職業指導員 ${has("職業指導員")?"あり":"なし"}／生活支援員 ${has("生活支援員")?"あり":"なし"}。市の手引き：サビ管が兼務できるのは管理者か「基準を超えて置いている職員」だけ。報酬区分（7.5:1など）の計算にこの人を入れてよいかは要確認`]);
    }
    ck.push([`常勤・兼務（B）の人：職種をまとめた合計が常勤の所定時間（${cap.toFixed(0)}時間）に届いている`, !short.length, short.length ? short.map(([nm,t])=>`${nm} ${fmtH(t)}時間`).join("・")+"（足りないと常勤として扱えません）" : ""]);
  }
  ck.push(["営業日に、職業指導員・生活支援員が誰もいない日がない", !noStaffDays.length, noStaffDays.length ? `いない日：${noStaffDays.map(d=>`${d}日`).join("・")}（計算上の基準とは別。運営上の確認）` : ""]);
  return {n, wk, cap, rows, direct, ck, noStaffDays, people};
}

// 入力のたびに書き換える部分（再描画するとiPadで入力中の欄が閉じるため）
function shOut(){
  const o = shCalc(), out = {};
  o.rows.forEach((x,i)=>{
    out["lab"+i] = `${esc(x.r.name||"（氏名未入力）")}<div class="note">${esc(x.r.job)}・${x.r.form}</div>`;
    out["tot"+i] = x.total.toFixed(1) + (x.sum>x.total ? `<div class="note" style="color:var(--red)">上限</div>` : "");
    out["wav"+i] = x.weekAvg.toFixed(1);
    out["fte"+i] = x.fte.toFixed(2);
  });
  for (let d=1; d<=o.n; d++){
    out["dsum"+d] = fmtH(o.rows.reduce((a,x)=>a+shHour(x.r,d), 0));
    out["ddir"+d] = shOff(d) ? "" : fmtH(o.rows.filter(x=>SH_DIRECT.includes(x.r.job)).reduce((a,x)=>a+shHour(x.r,d), 0));
  }
  out.cap = `${SH.period==="4週" ? "4週" : "1か月"}の上限 ${o.cap.toFixed(0)}時間（常勤の所定時間${o.wk!==+SH.week?"。週32時間未満のため32時間で計算":""}）`;
  out.persons = Object.entries(o.people).filter(([,xs])=>xs.length>=2).map(([nm,xs])=>`<li><b>${esc(nm)}</b>：${xs.map(x=>`${esc(x.r.job)} ${fmtH(x.total)||0}時間`).join("＋")}＝<b>${fmtH(xs.reduce((a,x)=>a+x.total,0))||0}時間</b></li>`).join("") || "<li>兼務の人はいません（同じ氏名の行が2つ以上あると兼務として集計します）</li>";
  const ng = o.ck.filter(c=>!c[1]).length;
  out.verdict = ng ? `<span class="tag ng">${ng}項目 未達</span>` : `<span class="tag ok">すべて満たしています</span>`;
  out.checks = o.ck.map(c=>`<li><span class="tag ${c[1]?"ok":"ng"}">${c[1]?"OK":"未達"}</span> ${esc(c[0])}${c[2]?`<div class="note">${esc(c[2])}</div>`:""}</li>`).join("");
  return out;
}
const fmtH = v => v ? (Math.round(v*10)/10).toString() : "";
function shRefresh(){ const o = shOut(); document.querySelectorAll("[data-shout]").forEach(el=>{ el.innerHTML = o[el.dataset.shout] ?? ""; }); }

function pShift(){
  const n = shDays(), mk = shMK(), o = shOut(), W = "日月火水木金土";
  const S_ = k => `<span data-shout="${k}">${o[k]??""}</span>`;
  const opt = (v, list) => list.map(x=>{ const [val,lab] = Array.isArray(x)?x:[x,x]; return `<option value="${val}" ${String(val)===String(v)?"selected":""}>${lab}</option>`; }).join("");
  const inp = (k, v, attr="") => `<input data-shk="${k}" value="${esc(String(v??""))}" ${attr}>`;
  const sel = (k, v, list) => `<select data-shk="${k}">${opt(v, list)}</select>`;
  const years = [2026,2027,2028].map(y=>[y, y+"年"]), months = Array.from({length:12},(_,i)=>[i+1,(i+1)+"月"]);
  const staff = SH.rows.map((r,i)=>`<tr>
    <td class="n">${i+1}</td>
    <td>${sel(`rows.${i}.job`, r.job, SH_JOBS)}</td>
    <td>${sel(`rows.${i}.form`, r.form, SH_FORMS)}</td>
    <td>${inp(`rows.${i}.qual`, r.qual, 'placeholder="例：社会福祉士"')}</td>
    <td>${inp(`rows.${i}.name`, r.name, 'placeholder="氏名"')}</td>
    <td>${inp(`rows.${i}.kenmu`, r.kenmu, 'placeholder="例：サービス管理責任者と兼務" class="w"')}</td>
    <td style="white-space:nowrap"><button class="btn sub" data-shfill="${i}">一括入力</button> <button class="btn del" data-shdel="${i}">削除</button></td></tr>`).join("");
  let head = `<th class="nm">氏名</th>`, foot1 = `<td class="nm"><b>全員の合計</b></td>`, foot2 = `<td class="nm"><b>職業指導員＋生活支援員</b></td>`, foot3 = `<td class="nm">サービス提供時間</td>`;
  for (let d=1; d<=n; d++){
    const wd = shWd(d), off = shOff(d), cls = `${off?"off":""} ${wd===0?"sun":wd===6?"sat":""}`;
    head += `<th class="${cls}" data-shoff="${d}" title="押すと営業日／休業日を切り替え">${d}<br>${W[wd]}${off?"<br>休":""}</th>`;
    foot1 += `<td class="${off?"off":""}">${S_("dsum"+d)}</td>`;
    foot2 += `<td class="${off?"off":""}">${S_("ddir"+d)}</td>`;
    foot3 += `<td class="${off?"off":""}">${off?"":fmtH(+SH.svc)}</td>`;
  }
  head += `<th>合計</th><th>週平均</th><th>常勤換算</th>`;
  const grid = SH.rows.map((r,i)=>{
    let tds = `<td class="nm">${S_("lab"+i)}</td>`;
    for (let d=1; d<=n; d++){ const v = ((r.h||{})[mk]||{})[d] ?? ""; tds += `<td class="${shOff(d)?"off":""}"><input data-shh="${i}:${d}" value="${esc(String(v))}" inputmode="decimal" aria-label="${d}日"></td>`; }
    return `<tr>${tds}<td class="n">${S_("tot"+i)}</td><td class="n">${S_("wav"+i)}</td><td class="n"><b>${S_("fte"+i)}</b></td></tr>`;
  }).join("");
  return `
  <div class="crumb">開設準備 ＞ 勤務表</div>
  <h1>勤務表（勤務形態一覧表）</h1>
  <div class="warn"><b>指定基準の確認は、4週または1か月分の勤務表から出す常勤換算（＝勤務時間を常勤1人分に直した人数）で行います。</b>必要人数の元になる利用者数も、その日の出席者数ではなく「前年度の1日平均」（新規開設は推定数）です。<br>
  出典：泉佐野市「参考資料4 勤務形態一覧表（就労継続支援A型・B型）」の記入方法（期間は「4週」か「暦月」、「指定基準の確認に際しては、4週分の入力で差し支えありません」）、泉佐野市「指定申請の手引き（日中活動系）」の常勤換算の計算方法。<br>
  <span class="tag ng">要確認</span> 「日ごとに基準を下回っても問題ない」と書いた文書は未確認です。営業日に職業指導員・生活支援員が誰もいない日は、下のチェックで表示します。市の広域福祉課に確認すること（「必要書類」ページの「市に電話で確認すること」に記載）。</div>
  <div class="note" style="margin-bottom:14px">泉佐野市の「参考資料4 勤務形態一覧表（就労継続支援A型・B型）」と同じ項目です。市の記入方法では、必要な項目がそろっていれば事業所のシフト表で代わりにしてよいとされています。入力した氏名・時間は<b>この端末の中だけ</b>に保存され、公開ページには載りません。</div>

  <div class="card"><h2>1. 表の条件</h2><div class="body scroll"><table class="form">
    <tr><th>年月</th><td>${sel("y", SH.y, years)} ${sel("m", SH.m, months)}</td><th>記載する期間</th><td>${sel("period", SH.period, [["4週","4週（1日〜28日）"],["暦月","暦月（1か月まるごと）"]])}<div class="note">指定の確認は4週分で可</div></td></tr>
    <tr><th>予定／実績</th><td>${sel("kind", SH.kind, ["予定","実績"])}</td><th>施設外就労</th><td>${sel("gaisyu", SH.gaisyu, ["無","有"])}</td></tr>
    <tr><th>常勤が勤務すべき時間</th><td>週 ${inp("week", SH.week, 'type="number" class="s" step="0.5"')} 時間／月 ${inp("month", SH.month, 'type="number" class="s"')} 時間<div class="note">就業規則の所定時間。月は「暦月」のときに使います</div></td>
      <th>平均利用者数（推定）</th><td>${inp("users", SH.users, 'type="number" class="s" step="0.1"')} 人<div class="note">新規は定員×90%（${S.teiin}名→${(S.teiin*0.9).toFixed(1)}人）</div></td></tr>
    <tr><th>1日のサービス提供時間</th><td colspan="3">${inp("svc", SH.svc, 'type="number" class="s" step="0.5"')} 時間<div class="note">営業日の最下段に表示します</div></td></tr>
  </table></div></div>

  <div class="card"><h2>2. 職員の登録</h2><div class="body scroll"><table class="list">
    <tr><th>No.</th><th>職種</th><th>勤務形態</th><th>資格</th><th>氏名</th><th>兼務状況</th><th></th></tr>${staff}</table>
    <div class="tools" style="margin-top:10px"><button class="btn sub" data-shadd>＋ 行を追加</button> <button class="btn sub" data-shrows0>職員の行を初期の体制に戻す</button></div>
    <div class="note">兼務（＝1人で2つの職種をする）の人は、職種ごとに行を分け、<b>同じ氏名</b>にして、1日の勤務時間を職種ごとに按分（＝割り振り）して入れます。例：1日8時間なら「管理者3時間＋生活支援員5時間」。2つの行の合計が常勤の所定時間（4週160時間など）に届けば常勤として数えます。書き方の正式な扱いは<span class="tag ng">要確認</span>（市に確認）。「一括入力」で営業日すべてに同じ時間を入れられます。</div>
  </div></div>

  <div class="card"><h2>3. 勤務時間（${SH.y}年${SH.m}月・${SH.period}・${SH.kind}）</h2><div class="body">
    <div class="note" style="margin-bottom:8px">マスに勤務時間を入れます（例：8、6.5）。常勤の休暇は「休」と入れると勤務したものとして数えます（市の記入方法）。日付を押すと営業日／休業日を切り替えます。${S_("cap")}</div>
    <div class="scroll"><table class="shgrid"><tr>${head}</tr>${grid}<tr>${foot1}<td colspan="3"></td></tr><tr>${foot2}<td colspan="3"></td></tr><tr>${foot3}<td colspan="3"></td></tr></table></div>
    <div class="note" style="margin-top:10px"><b>兼務の人の合計</b><ul class="shck" style="margin-top:4px">${S_("persons")}</ul></div>
  </div></div>

  <div class="card"><h2>4. 人員基準のチェック ${S_("verdict")}</h2><div class="body">
    <ul class="shck">${S_("checks")}</ul>
    <div class="note">計算方法：常勤換算＝${SH.period==="4週"?"4週の合計時間÷4÷週の所定時間":"1か月の合計時間÷月の所定時間"}（市の様式と同じ。週の所定時間が32時間未満なら32時間）。1人の合計は常勤の所定時間が上限。必要人数は小数第2位を切り上げ、配置人数は切り捨て（市の手引き）。基準に満たないと人員欠如減算（基本報酬の70%）になります。詳しくは「制度ガイド」の人員の項目へ。</div>
  </div></div>`;
}

document.addEventListener("input", e=>{
  const el = e.target;
  if (el.dataset.shh){ const [i,d] = el.dataset.shh.split(":"); const r = SH.rows[+i]; r.h = r.h||{}; const m = r.h[shMK()] = r.h[shMK()]||{};
    const v = el.value.trim(); if (v==="") delete m[d]; else m[d] = (v==="休"||v==="やすみ") ? "休" : v; saveSH(); shRefresh(); return; }
  if (el.dataset.shk && el.tagName!=="SELECT"){ setSH(el.dataset.shk, el.type==="number" ? (el.value===""?0:+el.value) : el.value); saveSH(); shRefresh(); }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if (el.dataset.shk && el.tagName==="SELECT"){ const k = el.dataset.shk; setSH(k, (k==="y"||k==="m") ? +el.value : el.value); saveSH(); render(); }
});
document.addEventListener("click", e=>{
  const off = e.target.closest("[data-shoff]");
  if (off){ const d = +off.dataset.shoff, mk = shMK(); SH.off[mk] = SH.off[mk]||{}; SH.off[mk][d] = !shOff(d); saveSH(); render(); return; }
  if (e.target.closest("[data-shrows0]")){ if (!confirm("職員の行を初期の体制（父：管理者兼生活支援員、母：サビ管兼職業指導員、雇用の職業指導員、パートの生活支援員）に戻します。入力した氏名・勤務時間は消えます。よろしいですか？")) return; SH.rows = shDefault().rows; saveSH(); render(); return; }
  const add = e.target.closest("[data-shadd]");
  if (add){ SH.rows.push({job:"生活支援員", form:"C", qual:"", name:"", kenmu:"", h:{}}); saveSH(); render(); return; }
  const del = e.target.closest("[data-shdel]");
  if (del){ if (!confirm("この行を削除しますか？（入力した勤務時間も消えます）")) return; SH.rows.splice(+del.dataset.shdel, 1); saveSH(); render(); return; }
  const fill = e.target.closest("[data-shfill]");
  if (fill){ const r = SH.rows[+fill.dataset.shfill]; const v = prompt(`${r.name||r.job}：営業日すべてに入れる勤務時間（空欄で消去）`, "8"); if (v===null) return;
    r.h = r.h||{}; const m = r.h[shMK()] = r.h[shMK()]||{}; for (let d=1; d<=shDays(); d++) if (!shOff(d)) { if (v.trim()==="") delete m[d]; else m[d] = v.trim(); }
    saveSH(); render(); }
});
function setSH(path, v){ const ks = path.split("."); const last = ks.pop(); ks.reduce((o,k)=>o[k], SH)[last] = v; }

let gQ = "", gCat = "すべて";
function pGloss(){
  const cats = ["すべて", ...new Set(GLOSS.map(g=>g[2]))];
  return `
  <div class="crumb">開設準備 ＞ 用語集</div>
  <h1>用語集</h1>
  <div class="note" style="margin-bottom:10px">分からない言葉を入力すると、その場で絞り込みます。ひらがなでも探せます（例：「じょうきん」）。</div>
  <input type="search" data-gq value="${esc(gQ)}" placeholder="例：常勤換算、サビ管、工賃" style="width:100%;max-width:520px;font-size:16px;padding:10px 12px;margin-bottom:10px">
  <div class="tools">${cats.map(c=>`<button class="btn ${c===gCat?"":"sub"}" data-gcat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div id="glist">${glossList()}</div>`;
}
function glossList(){
  const q = gQ.trim().toLowerCase();
  const hit = GLOSS.filter(g=>(gCat==="すべて" || g[2]===gCat) && (!q || (g[0]+" "+g[1]+" "+g[3]+" "+g[4]).toLowerCase().includes(q)));
  if (!hit.length) return `<div class="note">見つかりませんでした。別の言い方で探すか、「制度ガイド」も見てください。</div>`;
  return hit.map(g=>`<div class="doc"><div class="dt"><b>${esc(g[0])}</b><span class="tag">${esc(g[2])}</span></div><div class="dd">${esc(g[3])}</div>${g[4]?`<div class="dd note">${esc(g[4])}</div>`:""}</div>`).join("")
    + `<div class="note">${hit.length}件</div>`;
}
document.addEventListener("input", e=>{ if (e.target.matches("[data-gq]")){ gQ = e.target.value; document.getElementById("glist").innerHTML = glossList(); } });
document.addEventListener("click", e=>{ const b = e.target.closest("[data-gcat]"); if (b){ gCat = b.dataset.gcat; render(); } });

// すべてのページの定義を読み込んでから最初の表示をする（#guide などで直接開いたときのエラー防止）
render();
